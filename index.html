<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>台本スタジオ v2.6</title>
<style>
:root{
  --ink:#1a1d23; --ink-2:#4a5058; --ink-3:#868d96;
  --paper:#faf8f4; --chrome:#eeebe4; --chrome-2:#e4e0d7; --rule:#d6d1c6;
  --ai:#2a4a6b; --warn:#8a5a1a; --err:#8f2f2f;

  --hl-ending:#e05c5c; --hl-conj:#e08a3c; --hl-punct:#d4b106;
  --hl-fuseji:#d1479a; --hl-resnum:#7b52ab; --hl-kansuji:#12907c;
  --hl-kansuji_warn:#4bab9a; --hl-suremember:#c9760e; --hl-structure:#cc6a2b;
  --hl-length:#5b6b7c; --hl-misc:#2f7fbf;
  --hl-dup:#b03060;
  --hl-joyo:#6a4c9c;

  --mark1:#d94f4f; --mark2:#2f6fb5; --mark3:#c9a227;
  --mark4:#3f8f5f; --mark5:#8a5cb8; --mark6:#5a5a5a;

  --ui:"Yu Gothic UI","Yu Gothic","Hiragino Sans","Meiryo",system-ui,sans-serif;
  --doc:Arial,"Yu Gothic","Hiragino Sans","Meiryo",sans-serif;

  --ed-font:var(--doc);
  --ed-size:16px;
  --ed-lh:1.15;
  --ref-size:14px;
  --bad-a:0.16;        /* 検査表示の濃さ */
  --bad-bar:4px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--ui);font-size:13px;color:var(--ink);background:var(--chrome);overflow:hidden}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ai);outline-offset:1px}

#shell{display:flex;flex-direction:column;height:100%}

/* ---- 作品タブ ---- */
#worktabs{display:flex;background:var(--chrome-2);border-bottom:1px solid var(--rule);padding:0 6px;min-height:30px}
.wtab{display:flex;align-items:center;gap:6px;padding:0 10px;border:none;background:none;
  border-right:1px solid var(--rule);max-width:210px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.wtab.on{background:var(--chrome);color:var(--ink);box-shadow:inset 0 -2px 0 var(--ai)}
.wtab .x{opacity:.25;font-size:11px}
.wtab:hover .x{opacity:1}
#wtab-add{padding:0 10px;border:none;background:none;color:var(--ink-3)}

/* ---- ツールバー ---- */
#bar{display:flex;align-items:center;gap:4px;padding:5px 8px;background:var(--chrome);
  border-bottom:1px solid var(--rule);flex-wrap:wrap}
.btn{padding:4px 10px;border:1px solid var(--rule);background:var(--paper);border-radius:3px}
.btn:hover{background:#fff;border-color:var(--ink-3)}
.btn.on{background:var(--ai);color:#fff;border-color:var(--ai)}
.btn.mini{padding:2px 7px;font-size:11px}
.sep{width:1px;height:18px;background:var(--rule);margin:0 4px}
.grow{flex:1}
/* いま太字かどうかを示す札。太字＝黒、通常＝白。 */
#boldstate{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 7px;
  border-radius:3px;border:1px solid var(--ink-3);background:#fff;color:var(--ink-2);
  font-size:11px;user-select:none}
#boldstate::before{content:'B';display:inline-flex;align-items:center;justify-content:center;
  width:16px;height:16px;border-radius:3px;border:1px solid var(--ink-3);
  background:#fff;color:var(--ink-2);font-weight:700;font-size:11px;line-height:1}
#boldstate.is-bold{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:700}
#boldstate.is-bold::before{background:#fff;color:var(--ink);border-color:#fff}

#main{flex:1;display:flex;min-height:0}
/* 書式の枠 */
#fmtbar{display:flex;align-items:center;gap:6px;padding:4px 8px;background:var(--chrome);
  border-bottom:1px solid var(--rule)}
.fmt-l{font-size:11px;color:var(--ink-3);margin-right:2px}
.fmt-note{font-size:11px;color:var(--ink-3);margin-left:6px}
.fmtbtn{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border:1px solid var(--rule);
  background:var(--paper);border-radius:3px;position:relative}
.fmtbtn:hover{background:#fff;border-color:var(--ink-3)}
.fmtbtn .fa{font-weight:700;font-family:Arial,sans-serif}
.fmtbtn .fb{font-size:11px}
.fmtbtn .fsw{width:16px;height:4px;border-radius:1px;border:1px solid rgba(0,0,0,.2)}
.fmtbtn .dd{font-size:9px;color:var(--ink-3)}
/* 色見本 */
#palette{position:fixed;z-index:20;background:#fff;border:1px solid var(--rule);border-radius:6px;
  box-shadow:0 6px 24px rgba(0,0,0,.18);padding:10px;width:auto}
.pal-hd{font-size:11px;color:var(--ink-3);margin-bottom:6px}
.pal-none{display:block;width:100%;text-align:left;border:none;background:none;padding:5px 4px;margin-bottom:6px;
  border-radius:3px}
.pal-none:hover{background:var(--chrome)}
.pal-grid{display:grid;grid-template-columns:repeat(10,20px);gap:4px}
.pal-c{width:20px;height:20px;border-radius:50%;border:1px solid rgba(0,0,0,.15);padding:0}
.pal-c:hover{transform:scale(1.15);box-shadow:0 0 0 2px #fff,0 0 0 3px var(--ink-3)}
.pal-c.gap{margin-top:6px}
.pal-custom{display:flex;align-items:center;gap:6px;margin-top:10px;padding-top:8px;border-top:1px solid var(--rule);font-size:11px}
.pal-custom input{width:34px;height:24px;padding:0;border:1px solid var(--rule)}
.vsplit{width:5px;flex:none;cursor:col-resize;background:transparent}
.vsplit:hover,.vsplit.drag{background:var(--ai);opacity:.35}
.hsplit{height:5px;flex:none;cursor:row-resize;background:transparent}
.hsplit:hover,.hsplit.drag{background:var(--ai);opacity:.35}

/* ---- 工程 ---- */
#stages{width:170px;flex:none;background:var(--chrome);display:flex;flex-direction:column;overflow:auto}
.stage{display:flex;align-items:center;gap:6px;padding:6px 8px;border:none;background:none;width:100%;
  text-align:left;border-bottom:1px solid rgba(0,0,0,.05);color:var(--ink-2)}
.stage:hover{background:var(--chrome-2)}
.stage.on{background:var(--paper);color:var(--ink);box-shadow:inset 3px 0 0 var(--ai)}
.stage .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage .ct{font-size:10px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.stage .dot{width:7px;height:7px;border-radius:50%;flex:none}
.stage .dot.off{visibility:hidden}
#stage-add{padding:7px 8px;border:none;background:none;color:var(--ink-3);text-align:left}
#stage-add:hover{background:var(--chrome-2)}

/* ---- エディタ ---- */
.pane{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--paper)}
.pane-hd{display:flex;align-items:center;gap:8px;padding:4px 10px;border-bottom:1px solid var(--rule);
  color:var(--ink-3);font-size:11px}
.ed{flex:1;overflow:auto;outline:none;padding:14px 20px 60vh 62px;
  font-family:var(--ed-font);font-size:var(--ed-size);line-height:var(--ed-lh);
  white-space:pre-wrap;word-break:break-all;position:relative}
.ed.guide{background-image:linear-gradient(to right,transparent 0 calc(62px + 40em),var(--rule) calc(62px + 40em) calc(62px + 40em + 1px),transparent 0);background-repeat:no-repeat}
.ln{position:relative;min-height:calc(var(--ed-lh) * 1em)}
.ln::before{content:attr(data-g);position:absolute;left:-58px;width:50px;text-align:right;
  font-family:var(--ui);font-size:10px;line-height:inherit;color:var(--ink-3);
  font-variant-numeric:tabular-nums;user-select:none;pointer-events:none}
.ln.t-thread,.ln.t-img{font-weight:700}
.ln.t-img{color:var(--ink-2)}
.ln.t-head{color:var(--ai);font-family:var(--ui);font-size:.85em;font-weight:700}
.ln.t-blank{border-bottom:1px solid rgba(0,0,0,.05)}
.mk{color:var(--ink-3);font-weight:400;opacity:.75}
.at{background:var(--fx-at-bg,#ffff00)}
.pp{background:var(--fx-pp-bg,#ffff00);color:var(--fx-pp-fg,#ff0000)}
.ln.cur{background:rgba(42,74,107,.05)}
.ln.play{background:rgba(42,74,107,.16)}
.ln.found{background:rgba(212,177,6,.28)}

/* 検査の見せ方（設定で切替） */
.ln.bad{background:color-mix(in srgb,var(--c) calc(var(--bad-a)*100%),transparent)}
.st-bar .ln.bad{box-shadow:inset var(--bad-bar) 0 0 var(--c)}
.st-under .ln.bad{background:none;text-decoration:underline wavy var(--c);text-underline-offset:3px}
.st-both .ln.bad{box-shadow:inset var(--bad-bar) 0 0 var(--c);text-decoration:underline wavy var(--c);text-underline-offset:3px}
.st-fill .ln.bad{box-shadow:none}

/* 目印 */
.ln[data-mark]{box-shadow:inset var(--bad-bar) 0 0 var(--c,transparent), inset 0 0 0 2px var(--mc)}
.ln[data-mark]::after{content:'';position:absolute;left:-70px;top:.45em;width:9px;height:9px;
  border-radius:50%;background:var(--mc);box-shadow:0 0 0 2px var(--paper)}

/* ---- 副ペイン ---- */
#side{width:340px;flex:none;background:var(--chrome);display:flex;flex-direction:column;min-height:0}
#refbox{display:flex;flex-direction:column;min-height:0;height:240px;border-bottom:1px solid var(--rule)}
#refbox.hide{display:none}
.sec-hd{display:flex;align-items:center;gap:6px;padding:4px 8px;background:var(--chrome-2);
  border-bottom:1px solid var(--rule);color:var(--ink-2);font-size:11px}
#refed{flex:1;overflow:auto;outline:none;padding:8px 12px 20vh 12px;background:var(--paper);
  font-family:var(--ed-font);font-size:var(--ref-size);line-height:var(--ed-lh);white-space:pre-wrap;word-break:break-all}
#refed .ln::before{display:none}
#sidetabs{display:flex;border-bottom:1px solid var(--rule);flex:none}
.stab{flex:1;padding:6px 2px;border:none;background:none;color:var(--ink-3);font-size:12px}
.stab.on{background:var(--paper);color:var(--ink);box-shadow:inset 0 -2px 0 var(--ai)}
.sbody{flex:1;overflow:auto;display:none;min-height:0}
.sbody.on{display:block}
.grp{border-bottom:1px solid var(--rule)}
.grp>summary{padding:5px 9px;cursor:pointer;list-style:none;display:flex;align-items:center;gap:7px}
.grp>summary::-webkit-details-marker{display:none}
.sw{width:10px;height:10px;border-radius:2px;flex:none}
.grp .n{margin-left:auto;color:var(--ink-3);font-variant-numeric:tabular-nums}
.hit{display:flex;gap:6px;align-items:flex-start;padding:5px 9px;border-top:1px solid rgba(0,0,0,.05)}
.hit:hover{background:var(--chrome-2)}
.hit .go{flex:1;text-align:left;border:none;background:none;padding:0;color:var(--ink-2);line-height:1.45}
.hit .ln-no{color:var(--ink-3);font-variant-numeric:tabular-nums;margin-right:5px}
.hit .head{display:block;color:var(--ink);opacity:.75;margin-top:2px;font-size:11px}
.hit .ex{border:none;background:none;color:var(--ink-3);font-size:10px;padding:0 2px;flex:none}
.hit input{margin-top:3px;flex:none}
.hit.done .go{opacity:.45;text-decoration:line-through}
.empty{padding:22px 14px;color:var(--ink-3);line-height:1.7}
.row{display:flex;gap:5px;padding:6px 9px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--rule)}
.mk-row{display:flex;align-items:center;gap:6px;padding:5px 9px;border-top:1px solid rgba(0,0,0,.05)}
.mk-row.lost{background:#fbeaea}
.mk-row .go{flex:1;text-align:left;border:none;background:none;padding:0;color:var(--ink-2)}
.cdot{width:15px;height:15px;border-radius:50%;border:1px solid rgba(0,0,0,.2);padding:0;flex:none}
.cdot.on{outline:2px solid var(--ink);outline-offset:1px}
.ol-row{display:block;width:100%;text-align:left;border:none;background:none;padding:4px 9px;
  border-top:1px solid rgba(0,0,0,.04);color:var(--ink-2)}
.ol-row:hover{background:var(--chrome-2)}
.ol-row.head{font-weight:700;color:var(--ai);background:var(--chrome-2)}
.ol-row .num{font-variant-numeric:tabular-nums;color:var(--ink-3);margin-right:6px}

#status{display:flex;align-items:center;gap:13px;padding:4px 12px;background:var(--chrome-2);
  border-top:1px solid var(--rule);color:var(--ink-2);font-variant-numeric:tabular-nums;font-size:11px;flex-wrap:wrap}
#status b{font-weight:700;color:var(--ink)}
.pill{padding:1px 6px;border-radius:9px;background:var(--paper);border:1px solid var(--rule)}
.pill.bad{background:#f7dcdc;border-color:#e0b4b4;color:var(--err)}

dialog{border:1px solid var(--rule);border-radius:4px;padding:0;background:var(--paper);color:var(--ink);
  box-shadow:0 8px 40px rgba(0,0,0,.22);max-width:min(94vw,680px)}
dialog::backdrop{background:rgba(20,22,26,.35)}
.dlg-hd{padding:11px 16px;border-bottom:1px solid var(--rule);font-weight:700}
.dlg-bd{padding:14px 16px;line-height:1.75;max-height:64vh;overflow:auto}
.dlg-ft{padding:10px 16px;border-top:1px solid var(--rule);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
input[type=text],input[type=number],select,textarea{font-family:inherit;font-size:12px;padding:4px 6px;
  border:1px solid var(--rule);border-radius:3px;background:#fff;color:var(--ink)}
textarea{width:100%;min-height:110px;font-family:var(--ui);line-height:1.6}
table.diff{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
table.diff td,table.diff th{border-bottom:1px solid var(--rule);padding:3px 6px;text-align:left;font-size:12px}
.kv{display:grid;grid-template-columns:170px 1fr;gap:8px 10px;align-items:center}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--rule);margin-bottom:12px}
.tabs button{padding:5px 11px;border:none;background:none;color:var(--ink-3);border-bottom:2px solid transparent}
.tabs button.on{color:var(--ink);border-bottom-color:var(--ai)}
.tp{display:none}.tp.on{display:block}
.note{color:var(--ink-2);font-size:12px}
.keyrow{display:flex;gap:5px;align-items:center;margin:2px 0}
.keycap{padding:2px 8px;border:1px solid var(--rule);border-radius:3px;background:#fff;font-size:11px}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:7px 15px;border-radius:3px;opacity:0;pointer-events:none;transition:opacity .18s;z-index:9}
#toast.on{opacity:.94}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="shell">
  <div id="worktabs"></div>

  <div id="bar">
    <button class="btn" id="b-open">開く</button>
    <button class="btn" id="b-save">保存</button>
    <button class="btn" id="b-copy">コピー</button>
    <button class="btn" id="b-paste">貼り付け</button>
    <button class="btn" id="b-paste-plain" title="書式なしで貼り付け（Ctrl+Shift+V）">書式なしで貼る</button>
    <button class="btn" id="b-all">全選択</button>
    <span class="sep"></span>
    <span id="boldstate">通常</span>
    <button class="btn" id="b-mode">記号を表示</button>
    <span class="sep"></span>
    <button class="btn" id="b-num">次の番号</button>
    <button class="btn" id="b-renum">番号を振り直す</button>
    <span class="sep"></span>
    <button class="btn" id="b-mark">目印</button>
    <button class="btn" id="b-find">検索</button>
    <button class="btn" id="b-speak">読み上げ</button>
    <button class="btn" id="b-ver">履歴</button>
    <span class="grow"></span>
    <span style="color:var(--ink-3);font-size:11px">v2.6</span>
    <button class="btn" id="b-set">設定</button>
  </div>

  <div id="fmtbar">
    <span class="fmt-l">書式</span>
    <button class="fmtbtn" id="fc-fg" title="文字の色（選んだ範囲）">
      <span class="fa">A</span><span class="fsw" id="fg-sw"></span><span class="dd">▾</span></button>
    <button class="fmtbtn" id="fc-bg" title="背景の色（選んだ範囲）">
      <span class="fb">背</span><span class="fsw" id="bg-sw"></span><span class="dd">▾</span></button>
    <button class="fmtbtn" id="fc-clear" title="選んだ範囲の色を外す">色を外す</button>
    <span class="fmt-note">文字を選んでから色を選びます</span>
  </div>

  <div id="main">
    <div id="stages"></div>
    <div class="vsplit" id="sp1"></div>

    <div class="pane">
      <div class="pane-hd">
        <span id="ed-title"></span>
        <span class="grow"></span>
        <label><input type="checkbox" id="ck-on"> リアルタイムでチェックする</label>
        <label title="エディタの文字の大きさ（px）">字
          <input type="number" id="ed-size" min="9" max="34" step="1" style="width:52px"></label>
        <button class="btn mini" id="b-pause">一時停止</button>
      </div>
      <div class="ed guide" id="ed" contenteditable="true" spellcheck="false"></div>
    </div>

    <div class="vsplit" id="sp2"></div>

    <div id="side">
      <div id="refbox">
        <div class="sec-hd">
          <span>参照</span>
          <select id="refsel" style="flex:1;min-width:0"></select>
          <input type="number" id="ref-size" min="9" max="30" step="1" style="width:52px" title="参照の文字の大きさ（px）">
          <button class="btn mini" id="ref-hide">×</button>
        </div>
        <div id="refed" contenteditable="true" spellcheck="false"></div>
      </div>
      <div class="hsplit" id="sp3"></div>
      <div id="sidetabs">
        <button class="stab on" data-t="chk">チェック</button>
        <button class="stab" data-t="mark">目印</button>
        <button class="stab" data-t="out">見出し</button>
        <button class="stab" data-t="find">検索</button>
      </div>
      <div class="sbody on" id="sb-chk"></div>
      <div class="sbody" id="sb-mark"></div>
      <div class="sbody" id="sb-out"></div>
      <div class="sbody" id="sb-find"></div>
    </div>
  </div>

  <div id="status"></div>
</div>
<div id="toast"></div>
<input type="file" id="filein" accept=".txt,.json" hidden>
<script>
"use strict";
// ===================== LOGIC START =====================

/* 台本スタジオ 中核ロジック
 * 既存 Google Apps Script（台本チェッカー／台本エフェクト）からの移植分と、
 * 生成プロンプトのルールに基づく追加検査。
 * DOM に依存しない純粋な関数だけをこの区画に置く。 */

/* ---------- 語彙・辞書（GASから移植。設定で編集可） ---------- */
const DICT = {
  approved:[
    'いずれにしても','いずれにせよ','以上のことから','これによって','これにより','それにより',
    'したがって','というのも','その一方で','それどころか','これを受けて','これを受け','この話を受けて',
    'その話を聞いた','それを聞いた','これを聞いた','この意見を受けて','この報告を受けて','この事実について',
    'この問いに対して','この疑問に対しては','その理由として','そんな中','それでも','くわえて',
    '加えて','さらには','ところが','なんでも','こうして','とはいえ','そのため',
    'そうして','ただし','ちなみに','しかも','つまり','まず','次に','最後に','そこには','そこで',
    'すると','そして','しかし','さらに','ただ','なんと','もしも','その後','それから',
    'これに対して','これに対し','その上','また',
    'この状況を受けて','この状況によって'
  ],
  /* 接続詞に見えるが認めない形。より長い承認語に一致する場合はそちらが優先される */
  headDeny:['これに','なんという','なんとも','なんとなく','まずは'],
  headExempt:[
    'ある日','ある時','この日','翌日','後日','数日後','数か月後','数ヶ月後','この後',
    '2024','2025','20','ここまで','以上','最後に','冒頭','まず','やがて','まもなく',
    'こうして','そうして','その後','その日','その頃','この時','この頃','当初','現在'
  ],
  fusejiChar:['殺','死','姦','刺','犯','痴','咥','血','亡','遺','呪','監','盗','虐','殴'],
  fusejiWord:['パワハラ','レイプ','いじめ','首吊り','行為','エロ','グロ','クソ','DV'],
  kanjiExempt:[
    '一度','一気','一瞬','一部','一切','一応','一日','一言','一方','一種','一緒',
    '一生','一目','一見','一同','一連','一律','一様','一斉','一因','一環','一貫','一心',
    '一晩','一蹴','一旦','一致','一時的',
    '万一','千載一遇','一石二鳥','穴二つ','二度','三度','四六時中','四季','十字','百科',
    '数十','数百','数千','数万','何十','何百','何千','何万',

/* ---------- 行の解釈 ---------- */
const RE_HEAD_MARK = /^【[^】]*】/;
const RE_NUMLINE   = /^(\d+)\s*[.．]\s*(イッチ|名無し)(.*)$/;
/** 記号つきの行の中の「番号.名前」を書き換える（先頭の ** を跨ぐ） */
const RE_NUMRAW    = /^(\s*(?:\*\*)?\s*)(\d+)(\s*[.．]\s*)(イッチ|名無し)/;
function setNumber(raw,n){
  return String(raw).replace(RE_NUMRAW,(m,pre,old,dot,who)=>pre+n+dot+who);
}
const RE_IMG       = /^[（(]\s*※/;
const RE_ANCHOR    = /^>>(\d+)/;

/** 装飾記号を取り除く（字数計算・内容検査に使う） */
function strip(s){
  return String(s||'')
    .replace(/\{\{(?:fg|bg)=#[0-9a-fA-F]{6}(?:;(?:fg|bg)=#[0-9a-fA-F]{6})?\|/g,'')
    .replace(/\}\}/g,'')
    .replace(/\*\*/g,'').replace(/@@/g,'').replace(/\+\+/g,'');
}
/** 太字記号を外した中身（@@ ++ は残す） */
function unbold(s){
  const t=String(s||'');
  const m=t.match(/^\s*\*\*([\s\S]*)\*\*\s*$/);
  return m?m[1]:t.replace(/\*\*/g,'');
}

function lineType(raw){
  const t=String(raw||'');
  const s=t.trim();
  if(s==='') return 'blank';
  if(RE_HEAD_MARK.test(s)) return 'head';
  if(s.startsWith('**')){
    const in_=strip(s).trim();
    return RE_IMG.test(in_) ? 'img' : 'thread';
  }
  return 'body';
}

/* ---------- 文字ごとの書式 ----------
 * 行の中身を1文字ずつ { c, fx, fg, bg } の列に分解し、操作してから記号に戻す。
 *   fx … 'at'（@@）／'pp'（++）／null
 *   fg … 文字の色（#rrggbb）／null
 *   bg … 背景の色（#rrggbb）／null
 * 色は {{fg=#rrggbb;bg=#rrggbb|文字}} と書く。どちらか片方だけでもよい。 */
function parseAttrs(s){
  let fg=null,bg=null,ok=false;
  String(s||'').split(';').forEach(p=>{
    const m=p.trim().match(/^(fg|bg)=(#[0-9a-fA-F]{6})$/);
    if(m){ ok=true; if(m[1]==='fg') fg=m[2].toLowerCase(); else bg=m[2].toLowerCase(); }
  });
  return ok?{fg,bg}:null;
}
function attrStr(fg,bg){ return [fg?'fg='+fg:'',bg?'bg='+bg:''].filter(Boolean).join(';'); }
function parseInner(inner){
  const t=String(inner||''), out=[];
  let i=0;
  while(i<t.length){
    const two=t.substr(i,2);
    if(two==='@@'||two==='++'){
      const c=t.indexOf(two,i+2);
      if(c>i+1){
        const fx=two==='@@'?'at':'pp';
        for(let k=i+2;k<c;k++) out.push({c:t[k],fx,fg:null,bg:null});
        i=c+2; continue;
      }
    }
    if(two==='{{'){
      const bar=t.indexOf('|',i+2);
      const end=bar>0?t.indexOf('}}',bar+1):-1;
      if(bar>i+1&&end>bar){
        const a=parseAttrs(t.slice(i+2,bar));
        if(a){
          for(let k=bar+1;k<end;k++) out.push({c:t[k],fx:null,fg:a.fg,bg:a.bg});
          i=end+2; continue;
        }
      }
    }
    out.push({c:t[i],fx:null,fg:null,bg:null}); i++;
  }
  return out;
}
/** 同じ書式が続くところをひとまとめにする */
function groupsOf(chars){
  const g=[];
  for(const ch of chars){
    const last=g[g.length-1];
    if(last&&last.fx===ch.fx&&last.fg===ch.fg&&last.bg===ch.bg) last.t+=ch.c;
    else g.push({t:ch.c,fx:ch.fx,fg:ch.fg,bg:ch.bg});
  }
  return g;
}
function serializeInner(chars){
  return groupsOf(chars).map(g=>{
    if(g.fx==='at') return '@@'+g.t+'@@';
    if(g.fx==='pp') return '++'+g.t+'++';
    if(g.fg||g.bg) return '{{'+attrStr(g.fg,g.bg)+'|'+g.t+'}}';
    return g.t;
  }).join('');
}
/** 表示位置 a〜b の部分を、書式を保ったまま取り出す */
function sliceInner(inner,a,b){ return serializeInner(parseInner(inner).slice(a,b)); }

/** 装飾を当てたHTMLを返す。
 *  mode='marks' … 記号を薄い色で表示する（執筆用）
 *  mode='plain' … 記号を隠し、ドキュメントと同じ見た目にする（既定）
 *  効果スパンには data-k を持たせ、ここから記号つきの原文を復元する。 */
const MK={at:'@@',pp:'++'};
function decorate(raw,mode){
  const t=String(raw||'');
  const plain=(mode!=='marks');
  const body=plain?unbold(t):t;
  if(body==='') return '<br>';
  const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  let out='',i=0,any=false;
  while(i<body.length){
    const two=body.substr(i,2);
    if(!plain&&two==='**'){ out+='<span class="mk">**</span>'; i+=2; any=true; continue; }
    if(two==='@@'||two==='++'){
      const close=body.indexOf(two,i+2);
      if(close>i+1){
        const k=two==='@@'?'at':'pp';
        const inner=esc(body.slice(i+2,close));
        out+=plain
          ? '<span class="'+k+'" data-k="'+k+'">'+inner+'</span>'
          : '<span class="'+k+'" data-k="'+k+'"><span class="mk">'+two+'</span>'+inner+'<span class="mk">'+two+'</span></span>';
        i=close+2; any=true; continue;
      }
    }
    if(two==='{{'){
      const bar=body.indexOf('|',i+2);
      const end=bar>0?body.indexOf('}}',bar+1):-1;
      if(bar>i+1&&end>bar){
        const a=parseAttrs(body.slice(i+2,bar));
        if(a){
          const st=(a.fg?'color:'+a.fg+';':'')+(a.bg?'background-color:'+a.bg+';':'');
          const da=' data-k="cs"'+(a.fg?' data-fg="'+a.fg+'"':'')+(a.bg?' data-bg="'+a.bg+'"':'');
          const inner=esc(body.slice(bar+1,end));
          out+=plain
            ? '<span class="cs"'+da+' style="'+st+'">'+inner+'</span>'
            : '<span class="cs"'+da+' style="'+st+'"><span class="mk">{{'+esc(body.slice(i+2,bar))+'|</span>'+
              inner+'<span class="mk">}}</span></span>';
          i=end+2; any=true; continue;
        }
      }
    }
    out+=esc(body[i]); i++;
  }
  return out===''?'<br>':out;
}
/** 行のDOMから記号つきの原文を組み立て直す */
function rawFromLine(div,mode){
  if(mode==='marks') return div.textContent;
  let s='';
  for(const n of div.childNodes){
    if(n.nodeType===3){ s+=n.data; continue; }
    if(n.nodeName==='BR') continue;
    const k=n.dataset&&n.dataset.k;
    if(k==='cs'){
      const tx=n.textContent;
      if(tx) s+='{{'+attrStr(n.dataset.fg||null,n.dataset.bg||null)+'|'+tx+'}}';
      continue;
    }
    s+=k?MK[k]+n.textContent+MK[k]:n.textContent;
  }
  const bold=div.classList.contains('t-thread')||div.classList.contains('t-img');
  return bold&&s.trim()!==''?'**'+s+'**':s;
}

/** 記号つき原文を「太字か」「中身」に分ける／組み立てる。
 *  分割・結合・挿入はすべてこれを通し、** が片側だけ残ることを防ぐ。 */
function partsOf(raw){
  const t=String(raw||'');
  const m=t.match(/^\s*\*\*([\s\S]*)\*\*\s*$/);
  return m?{bold:true,inner:m[1]}:{bold:false,inner:t.replace(/\*\*/g,'')};
}
function buildRaw(bold,inner){
  if(inner==='') return bold?'':'';
  return bold?'**'+inner+'**':inner;
}
/** 表示上の位置 → 中身（inner）の中の位置 */
function innerOffset(inner,dispOff,mode){
  if(mode==='marks') return dispOff;
  let dd=0,i=0;
  while(i<inner.length&&dd<dispOff){
    const two=inner.substr(i,2);
    if(two==='@@'||two==='++'){
      const c=inner.indexOf(two,i+2);
      if(c>i+1){
        const len=c-i-2;
        if(dd+len>=dispOff) return i+2+(dispOff-dd);
        dd+=len; i=c+2; continue;
      }
    }
    dd++; i++;
  }
  return i;
}
/** 行を表示位置で二つに割る。太字は両側に正しく付け直す */
function splitRaw(raw,dispOff,mode,keepBold){
  const p=partsOf(raw);
  let a,b;
  if(mode==='marks'){ a=p.inner.slice(0,dispOff); b=p.inner.slice(dispOff); }
  else{
    // 書式の途中で割っても、両側に書式が正しく残る
    const ch=parseInner(p.inner);
    a=serializeInner(ch.slice(0,dispOff)); b=serializeInner(ch.slice(dispOff));
  }
  return [buildRaw(p.bold,a), buildRaw(p.bold&&keepBold!==false,b)];
}
/** 二行を繋ぐ。太字は前の行に合わせる */
function joinRaw(a,b){
  const pa=partsOf(a), pb=partsOf(b);
  // 継ぎ目で同じ書式が並んだら、ひとつの区間にまとめる
  return buildRaw(pa.bold||pb.bold, serializeInner(parseInner(pa.inner+pb.inner)));
}
/** 行の途中に文字列を差し込む */
function insertIntoRaw(raw,dispOff,text,mode){
  const p=partsOf(raw);
  if(mode==='marks') return buildRaw(p.bold,p.inner.slice(0,dispOff)+text+p.inner.slice(dispOff));
  const ch=parseInner(p.inner);
  ch.splice(dispOff,0,...parseInner(partsOf(text).inner));
  return buildRaw(p.bold,serializeInner(ch));
}

/** 表示上の文字列（記号を除いたもの）。40字判定や桁の勘定に使う */
function shown(raw){ return strip(raw); }

/* ---------- 検出（GAS移植） ---------- */
const RE_RUBY_INNER = /^[\u3040-\u309F\u30A0-\u30FF\u4E00-\u9FFF々ヶヵ\u30FC]+$/;
const RE_RUBY_CANDIDATE = /●([\u3040-\u309F\u4E00-\u9FFF々]*)[（(]([^（）()]*)[）)]/g;
const RE_RUBY_HEAD = /^●([\u3040-\u309F\u4E00-\u9FFF々]*)[（(]([^（）()]*)[）)]/;

function isValidRuby(after,inner){
  if(!RE_RUBY_INNER.test(inner)) return false;
  if(inner.length<1||inner.length>8) return false;
  const om=after.match(/[\u3040-\u309F]+$/);
  const ok=om?om[0]:'';
  if(ok.length>0 && inner.slice(-ok.length)!==ok) return false;
  return true;
}
function detectRuby(line){
  const r=[]; RE_RUBY_CANDIDATE.lastIndex=0; let m;
  while((m=RE_RUBY_CANDIDATE.exec(line))!==null){ if(isValidRuby(m[1],m[2])) r.push(m[0]); }
  return r;
}
function hasValidRubyAt(line,i){
  const m=RE_RUBY_HEAD.exec(line.slice(i));
  return m ? isValidRuby(m[1],m[2]) : false;
}
function detectFusejiLeak(line){
  if(!line) return [];
  const masked=[];
  const reParen=/[（(]([^（）()]*)[）)]/g; let pm;
  while((pm=reParen.exec(line))!==null){
    for(let c=pm.index;c<pm.index+pm[0].length;c++) masked[c]=true;
  }
  for(let i=0;i<line.length;i++) if(line[i]==='●') masked[i]=true;
  const res=[];
  for(const word of DICT.fusejiWord){
    let from=0,idx;
    while((idx=line.indexOf(word,from))!==-1){
      let free=false;
      for(let k=idx;k<idx+word.length;k++) if(!masked[k]){free=true;break;}
      if(free){ res.push({w:word,pos:idx}); for(let k=idx;k<idx+word.length;k++) masked[k]=true; }
      from=idx+word.length;
    }
  }
  for(const ch of DICT.fusejiChar){
    let f=0,id;
    while((id=line.indexOf(ch,f))!==-1){
      if(!masked[id]){ res.push({w:ch,pos:id}); masked[id]=true; }
      f=id+1;
    }
  }
  return res;
}
/** 伏字にすべき箇所を実際に伏せる。
 *  漢字1字 … 死んだ → ●んだ（本文はうしろに読み仮名を添える）
 *  語     … レイプ → レ●プ（2文字目を伏せる）
 *  すでに伏せてある箇所や括弧の中には手を出さない。 */
function applyFuseji(line,isBody){
  let out=String(line||'');
  const hits=detectFusejiLeak(out);
  if(!hits.length) return out;
  hits.sort((a,b)=>b.pos-a.pos);          // うしろから直す（位置がずれないように）
  for(const h of hits){
    const w=h.w, at=h.pos;
    if(w.length===1){
      // うしろに続く活用語尾だけを取り込む。助詞まで巻き込まない。
      const tail=out.slice(at+1);
      let kana='';
      const m=tail.match(/^[\u3040-\u309F]{1,4}/);
      if(m){
        const OKURI=['くなった','くなって','くなり','んだ','んで','した','して','られた','られて','れた','れて','める','めた','った','って','う','き','く','け','さ','し','ぬ','ね','み','む','り','る','れ'];
        for(const o of OKURI){ if(m[0].startsWith(o)){ kana=o; break; } }
      }
      const orig=w+kana;
      const rep=isBody ? '●'+kana+'('+orig+')' : '●'+kana;
      out=out.slice(0,at)+rep+out.slice(at+1+kana.length);
    }else{
      // 2文字目を伏せる
      const rep=w[0]+'●'+w.slice(2);
      out=out.slice(0,at)+rep+out.slice(at+w.length);
    }
  }
  return out;
}

function detectKanjiNumbers(line){
  if(!line) return [];
  const masked=[];
  for(const w of DICT.kanjiExempt.concat(DICT.kanjiCaution,DICT.proper||[])){
    let from=0,idx;
    while((idx=line.indexOf(w,from))!==-1){
      for(let c=idx;c<idx+w.length;c++) masked[c]=true;
      from=idx+w.length;
    }
  }
  const re=/[一二三四五六七八九〇十百千万億兆]/g,res=[]; let m;
  while((m=re.exec(line))!==null) if(!masked[m.index]) res.push({ch:m[0],pos:m.index});
  return res;
}
function detectKanjiCaution(line){
  if(!line) return [];
  const res=[];
  for(const w of DICT.kanjiCaution){
    let from=0,idx;
    while((idx=line.indexOf(w,from))!==-1){ res.push({w,pos:idx}); from=idx+w.length; }
  }
  return res;
}
function endingClass(line){
  const l=String(line||'').trim();
  for(const [suf,cls] of ENDINGS){
    if(l.length>=suf.length && l.slice(-suf.length)===suf) return cls;
  }
  return null;
}
const snip=(s,n)=>{s=String(s||'').trim();return s.length>n?s.slice(0,n)+'…':s};

/* ---------- 常用漢字ではない漢字 ---------- */
/** 許可外リストの語から漢字だけを取り出し、行の中に現れた箇所を返す。
 *  「貶す」と登録すれば「貶され」「貶めた」も拾う。 */
function detectNonJoyo(line){
  const s=String(line||'');
  if(!s) return [];
  const map=new Map();                         // 漢字 → 登録した語
  for(const w of (DICT.nonJoyo||[])){
    for(const ch of String(w)){
      if(/[\u4E00-\u9FFF々]/.test(ch)&&!map.has(ch)) map.set(ch,w);
    }
  }
  if(!map.size) return [];
  const out=[];
  for(let i=0;i<s.length;i++){
    const w=map.get(s[i]);
    if(w) out.push({at:i,ch:s[i],word:w});
  }
  return out;
}

/* ---------- 重複・構文崩れ ---------- */
/* 文字が並んでいるだけで咎めない。
 * 複数の手掛かりに点を付け、合計が足りたものだけを出す。
 *   3点以上 … エラー
 *   2点     … 注意
 *   1点以下 … 出さない
 * 例外は DICT.dupAllow / DICT.dupCommon、
 * 追加の言い回しは DICT.dupExtra に置く（設定から足せる）。 */

const DUP_PARTICLES='がをにのはもとでへや';

/** 助詞・助動詞のつながりとして明らかにおかしい形。
 *  ［形, 理由, 直し方, 点］。正規表現でも書ける。 */
const DUP_JOINS=[
  ['についてを','「について」と「を」が重なっています','「について」だけにする',3],
  ['についてが','「について」と「が」が重なっています','「については」にする',3],
  ['においてを','「において」と「を」が重なっています','「において」だけにする',3],
  ['にとってを','「にとって」と「を」が重なっています','「にとって」だけにする',3],
  ['によってを','「によって」と「を」が重なっています','「によって」だけにする',3],
  ['ていくする','「ていく」と「する」が重なっています','「ていく」だけにする',3],
  ['てくるする','「てくる」と「する」が重なっています','「てくる」だけにする',3],
  ['てしまうする','「てしまう」と「する」が重なっています','「てしまう」だけにする',3],
  ['ているする','「ている」と「する」が重なっています','「ている」だけにする',3],
  ['するする','「する」が重なっています','ひとつにする',3],
  ['したする','「した」と「する」が重なっています','どちらかにする',3],
  ['されるする','「される」と「する」が重なっています','「される」だけにする',3],
  ['できるする','「できる」と「する」が重なっています','「できる」だけにする',3],
  ['ますです','「ます」と「です」が重なっています','どちらかにする',3],
  ['ですます','「です」と「ます」が重なっています','どちらかにする',3],
  [/(だっ|かっ|まし|でし)たた(?![めきかくる])/,'「た」が重なっています','「た」をひとつにする',3],
  [/てい(た|る)\1(?![らりるれろ])/,'「ていた」「ている」の活用が重なっています','ひとつにする',3],
  [/という(という|いう)/,'「という」が重なっています','ひとつにする',3],
  [/(てきた|ていた|ている)(てきた|ていた|ている)/,'補助動詞が重なっています','ひとつにする',3],
  [/(のです|んです)(のです|んです)/,'文末が重なっています','ひとつにする',3],
  [/(とのこと|模様|様子)(とのこと|模様|様子)/,'文末が重なっています','ひとつにする',3]
];

/** いくつかの言い方が混ざったとみられる形 */
const DUP_MIX=[
  ['これにせいで','「これにより」と「そのせいで」が混ざっています','「これにより」か「そのせいで」にする',3],
  ['これによりで','「これにより」が崩れています','「これにより」にする',3],
  ['それにせいで','「それにより」と「そのせいで」が混ざっています','どちらかにする',3],
  ['なのでので','「ので」が重なっています','ひとつにする',3],
  ['だからので','「だから」と「ので」が重なっています','どちらかにする',3],
  ['ためにので','「ために」と「ので」が重なっています','どちらかにする',3],
  ['にもかかわらずが','「にもかかわらず」と「が」が重なっています','「にもかかわらず」だけにする',3],
  ['ことがことが','「ことが」が重なっています','ひとつにする',3],
  ['ものをものを','「ものを」が重なっています','ひとつにする',3],
  [/が(すべて|全て|みんな|皆|全部|どれ|それ|これ|どちら)が/,'主語の「が」が重なっています','うしろの「が」を外す',3],
  [/を(すべて|全て|全部)を/,'「を」が重なっています','うしろの「を」を外す',3],
  [/(について|に関して)(について|に関して)/,'同じ言い方が重なっています','ひとつにする',3]
];

/** 同じ助詞が並んでいないか。正しい言葉は DICT.dupAllow で避ける。 */
function dupParticles(line){
  const out=[];
  for(let i=0;i+1<line.length;i++){
    const c=line[i];
    if(c!==line[i+1]) continue;
    if(DUP_PARTICLES.indexOf(c)<0) continue;
    const around=line.slice(Math.max(0,i-3),i+5);
    if((DICT.dupAllow||[]).some(w=>w.length>1&&around.includes(w))) continue;
    // うしろにひらがなが続く場合は別の語の一部であることが多い。
    // ただし助詞が続く形（ののから、など）は残す。
    const rest=line.slice(i+2);
    if(/^[\u3040-\u309F]/.test(rest)&&!/^(から|まで|より|ほど|など|こそ|さえ|しか|は|が|を|に|も)/.test(rest)) continue;
    out.push({at:i,text:c+c,why:'助詞「'+c+'」が重なっています',
      fix:'「'+line.slice(Math.max(0,i-5),i)+c+line.slice(i+2,i+7)+'」',score:3});
  }
  return out;
}

/** 同じ語が近くで繰り返されていないか */
function dupNear(line,span){
  const out=[];
  const re=/[\u4E00-\u9FFF々]{2,}|[\u30A0-\u30FF\u30FC]{3,}/g;
  const seen=new Map(); let m;
  while((m=re.exec(line))!==null){
    const w=m[0];
    if((DICT.dupCommon||[]).includes(w)) continue;
    if(seen.has(w)){
      const prev=seen.get(w);
      if(m.index-prev<=(span||14)){
        out.push({at:m.index,text:w,why:'「'+w+'」が近くで繰り返されています',
          fix:'どちらかを別の言い方にする',score:2});
      }
    }
    seen.set(w,m.index);
  }
  return out;
}

/** 行の中の重複・構文崩れを拾う */
function detectDup(line){
  const s=String(line||'');
  if(!s.trim()) return [];
  const found=[];
  const push=(at,text,why,fix,score)=>{
    const around=s.slice(Math.max(0,at-3),at+String(text).length+3);
    if((DICT.dupAllow||[]).some(w=>w.length>1&&around.includes(w))) return;
    found.push({at,text,why,fix,score});
  };
  const scan=list=>{
    for(const row of (list||[])){
      const pat=row[0], why=row[1], fix=row[2], score=row[3]||3;
      if(pat instanceof RegExp){
        const re=new RegExp(pat.source,pat.flags.includes('g')?pat.flags:pat.flags+'g');
        let m;
        while((m=re.exec(s))!==null){
          push(m.index,m[0],why,fix,score);
          if(m.index===re.lastIndex) re.lastIndex++;
        }
      }else if(typeof pat==='string'&&pat){
        let from=0,at;
        while((at=s.indexOf(pat,from))!==-1){ push(at,pat,why,fix,score); from=at+pat.length; }
      }
    }
  };
  scan(DUP_JOINS); scan(DUP_MIX); scan(DICT.dupExtra);
  dupNear(s).forEach(r=>push(r.at,r.text,r.why,r.fix,r.score));

  // 近い場所で複数当たったものは点を足す
  const byPos=new Map();
  found.forEach(f=>{
    const k=Math.floor(f.at/4);
    const cur=byPos.get(k);
    if(!cur) byPos.set(k,Object.assign({},f));
    else{
      cur.score+=f.score;
      if(f.score>=3&&cur.score-f.score<3){ cur.why=f.why; cur.fix=f.fix; cur.text=f.text; cur.at=f.at; }
    }
  });
  return [...byPos.values()].filter(f=>f.score>=2).sort((a,b)=>a.at-b.at);
}

/* ---------- 日付・時間の読み取り ---------- */
function metaOf(raw){
  const at=raw.match(/@@([^@]*)@@/);
  const pp=raw.match(/\+\+([^+]*)\+\+/);
  const meta={date:null,elapsedH:null};
  if(at){
    const d=at[1].match(/(\d{4})\s*[\/年]\s*(\d{1,2})\s*[\/月]\s*(\d{1,2})/);
    if(d) meta.date=new Date(+d[1],+d[2]-1,+d[3]);
  }
  const src=(pp?pp[1]:'')+(at?at[1]:'');
  const h=src.match(/(\d+)\s*時間後/);
  if(h) meta.elapsedH=+h[1];
  const mi=src.match(/(\d+)\s*分後/);
  if(mi&&meta.elapsedH===null) meta.elapsedH=(+mi[1])/60;
  return meta;
}
/** 前後の番号行から、あるべき飛ばし幅の範囲を返す */
function gapRange(prevMeta,curMeta,cfg){
  const g=cfg&&cfg.gap?cfg.gap:{normal:[3,10],hours:[10,20],nextday:[30,50],days:[50,100]};
  if(prevMeta&&curMeta&&prevMeta.date&&curMeta.date){
    const d=Math.round((curMeta.date-prevMeta.date)/86400000);
    if(d>=2) return {range:g.days,why:'数日後'};
    if(d===1) return {range:g.nextday,why:'翌日'};
  }
  if(curMeta&&curMeta.elapsedH!==null&&curMeta.elapsedH>=1) return {range:g.hours,why:'1〜3時間後'};
  return {range:g.normal,why:'通常'};
}
const pick=([a,b])=>a+Math.floor(Math.random()*(b-a+1));
/** 重みつきで選ぶ。weights は {3:5, 4:3, ...} の形。
 *  指定が無い数は重み1として扱う。すべて0なら均等に選ぶ。 */
function pickWeighted(range,weights){
  const [a,b]=range;
  if(!weights) return pick(range);
  const vals=[],ws=[];
  let total=0;
  for(let n=a;n<=b;n++){
    const w=Math.max(0,Number(weights[n]!=null?weights[n]:1)||0);
    vals.push(n); ws.push(w); total+=w;
  }
  if(total<=0) return pick(range);
  let r=Math.random()*total;
  for(let i=0;i<vals.length;i++){ r-=ws[i]; if(r<=0) return vals[i]; }
  return vals[vals.length-1];
}

/* ---------- 本編の走査 ---------- */
/** 行配列から、検査対象の範囲と構造を組み立てる */
function analyze(lines){
  const L=lines.map((raw,i)=>{
    const type=lineType(raw);
    return {i,raw,type,inner:strip(raw).trim()};
  });
  // 検査範囲：【本編】の次〜【締め】の手前
  let from=0,to=L.length;
  const bi=L.findIndex(l=>l.type==='head'&&l.raw.includes('【本編】'));
  if(bi>=0) from=bi+1;
  const ei=L.findIndex((l,i)=>i>from&&l.type==='head'&&l.raw.includes('【締め】'));
  if(ei>=0) to=ei;
  const scope=L.slice(from,to);

  // 本文ブロック（空行・スレ・見出しで区切る）
  const bodyBlocks=[]; let cur=null;
  for(const l of scope){
    if(l.type==='body'){ if(!cur){cur={lines:[]};bodyBlocks.push(cur);} cur.lines.push(l); }
    else cur=null;
  }
  // スレブロック（連続する太字＝1投稿）
  const threadBlocks=[]; let tb=null;
  for(const l of scope){
    if(l.type==='thread'||l.type==='img'){ if(!tb){tb={lines:[],img:l.type==='img'};threadBlocks.push(tb);} tb.lines.push(l); }
    else tb=null;
  }
  threadBlocks.forEach(b=>{
    b.head=b.lines[0];
    const m=b.head.inner.match(RE_NUMLINE);
    b.num=m?+m[1]:null;
    b.who=m?m[2]:null;
    b.meta=metaOf(b.head.raw);
  });
  return {all:L,scope,from,to,bodyBlocks,threadBlocks};
}

/* ---------- 検査本体 ---------- */
function check(lines,cfg){
  cfg=Object.assign({jumpHint:10},cfg||{});
  const hits=[];
  const A=analyze(lines);
  const add=(i,kind,msg,sev)=>hits.push({i,kind,msg,sev:sev||KIND[kind].sev||'err'});

  /* --- 記号の閉じ忘れ（全行） --- */
  A.all.forEach(l=>{
    if(l.type==='blank'||l.type==='head') return;
    const cnt=(s,p)=>(l.raw.split(p).length-1);
    if(cnt(l.raw,'**')%2!==0) add(l.i,'misc','「**」が閉じていません');
    if(cnt(l.raw,'@@')%2!==0) add(l.i,'misc','「@@」が閉じていません');
    if(cnt(l.raw,'++')%2!==0) add(l.i,'misc','「++」が閉じていません');
    if(cnt(l.raw,'{{')!==cnt(l.raw,'}}')) add(l.i,'misc','色の記号「{{ }}」が閉じていません');
    if(l.type==='body'&&/\*\*/.test(l.raw)) add(l.i,'misc','本文の途中に「**」があります（太字は行ごとに閉じます）');
  });

  /* --- 本文：文末音 --- */
  let prevCls=null;
  A.bodyBlocks.forEach(b=>{
    const last=b.lines[b.lines.length-1];
    const cls=endingClass(last.inner);
    if(!cls&&last.inner!==''){
      add(last.i,'ending','文末音が不明です（体言止め・口語の可能性）→「'+snip(last.inner,16)+'」');
    }
    if(cls&&prevCls&&cls===prevCls){
      add(last.i,'ending','文末音の連続 ['+cls+']：前のブロックと同じ音で終わっています');
    }
    prevCls=cls;
  });

  /* --- 本文：接続詞 --- */
  let prevConj=null;
  const approved=DICT.approved.slice().sort((a,b)=>b.length-a.length);
  A.bodyBlocks.forEach(b=>{
    const head=b.lines[0], h=head.inner;
    let hit=null;
    for(const w of approved){ if(h.startsWith(w)){hit=w;break;} }
    let denied=null;
    for(const dw of DICT.headDeny){
      if(h.startsWith(dw)&&(!hit||hit.length<=dw.length)){denied=dw;break;}
    }
    if(denied){
      add(head.i,'conj','「'+denied+'」は単独では使えません（「'+denied+'対して」などの形に）→「'+snip(h,16)+'」');
      hit=null;
    }
    if(!hit&&!denied){
      let ex=h.startsWith('「');
      if(!ex) for(const w of DICT.headExempt){ if(h.startsWith(w)){ex=true;break;} }
      if(!ex) add(head.i,'conj','文頭が接続詞ではありません→「'+snip(h,16)+'」');
    }
    if(hit&&prevConj&&hit===prevConj){
      add(head.i,'conj','接続詞の連続 ['+hit+']：前のブロックと同じ語で始まっています');
    }
    prevConj=hit;
  });

  /* --- 本文：行ごとの内容 --- */
  A.bodyBlocks.forEach(b=>{
    b.lines.forEach(l=>{
      const line=l.inner;
      const st=line.replace(/「[^」]*」/g,'');
      if(st.includes('、')||st.includes('。')) add(l.i,'punct','句読点が入っています：'+snip(line,40));
      if(line.includes('話すところによると')||line.includes('話すところによれば'))
        add(l.i,'misc','「話したところによると」に：'+snip(line,40));
      for(let k=0;k<line.length;k++){
        if(line[k]==='●'&&!hasValidRubyAt(line,k)){
          add(l.i,'fuseji','本文の伏字に読み仮名（）がありません：'+snip(line,40)); break;
        }
      }
      const lk=detectFusejiLeak(line);
      if(lk.length) add(l.i,'fuseji','伏字漏れ ['+lk.map(x=>x.w).join('・')+']：'+snip(line,40));
      if(line.includes('●●')) add(l.i,'fuseji','●が連続しています：'+snip(line,40));
      const kn=detectKanjiNumbers(line);
      if(kn.length) add(l.i,'kansuji','漢数字 ['+kn.map(x=>x.ch).join('・')+']（半角数字に）：'+snip(line,40));
      const kc=detectKanjiCaution(line);
      if(kc.length) add(l.i,'kansuji_warn','要確認の数詞 ['+kc.map(x=>x.w).join('・')+']：'+snip(line,40));
      // 1行40字
      const n=line.length;
      if(n>40) add(l.i,'length','1行が'+n+'字です（40字以下に）', n>48?'err':'warn');
      detectDup(line).forEach(f=>{
        add(l.i,'dup',f.why+'：…'+snip(line.slice(Math.max(0,f.at-8)),26)+
          (f.fix?'　→ '+f.fix:''), f.score>=3?'err':'warn');
      });
      {
        const nj=detectNonJoyo(line);
        if(nj.length){
          const chs=[...new Set(nj.map(x=>x.ch))];
          add(l.i,'joyo','常用漢字ではありません ['+chs.join('・')+']：…'+
            snip(line.slice(Math.max(0,nj[0].at-6)),24)+'　→ ひらがなにするか言い換える');
        }
      }
    });
    // ブロックの行数
    const n=b.lines.length;
    if(n>=7) add(b.lines[0].i,'length','本文ブロックが'+n+'行です（7行以上）','err');
    else if(n>=4) add(b.lines[0].i,'length','本文ブロックが'+n+'行です（1〜3行が標準。4〜6行は例外）','info');
  });

  /* --- スレ：内容 --- */
  A.threadBlocks.forEach(b=>{
    const s=b.head.inner;
    const ok=RE_NUMLINE.test(s)||RE_IMG.test(s)||RE_ANCHOR.test(s);
    if(!ok) add(b.head.i,'resnum','スレ投稿が番号行・画像注釈で始まっていません→「'+snip(s,16)+'」');
    if(b.num!==null){
      const rest=s.match(RE_NUMLINE)[3].trim();
      if(rest&&!/^(20\d\d|※|\d+時)/.test(rest)&&!/時～|時〜/.test(rest))
        add(b.head.i,'resnum','番号行に本文が続いています（改行を）：'+snip(s,40));
    }
    b.lines.forEach(l=>{
      const line=l.inner;
      const lk=detectFusejiLeak(line);
      if(lk.length) add(l.i,'fuseji','伏字漏れ ['+lk.map(x=>x.w).join('・')+']：'+snip(line,40));
      detectRuby(line).forEach(r=>add(l.i,'fuseji','スレに不要な読み仮名：'+r));
      const body=line.replace(RE_NUMLINE,'');
      const kn=detectKanjiNumbers(body);
      if(kn.length) add(l.i,'kansuji','スレに漢数字 ['+kn.map(x=>x.ch).join('・')+']：'+snip(line,40));
      const kc=detectKanjiCaution(body);
      if(kc.length) add(l.i,'kansuji_warn','スレに要確認の数詞 ['+kc.map(x=>x.w).join('・')+']：'+snip(line,40));
      {
        const nj=detectNonJoyo(body);
        if(nj.length){
          const chs=[...new Set(nj.map(x=>x.ch))];
          add(l.i,'joyo','常用漢字ではありません ['+chs.join('・')+']：…'+
            snip(body.slice(Math.max(0,nj[0].at-6)),24)+'　→ ひらがなにするか言い換える');
        }
      }
      detectDup(body).forEach(f=>{
        if(f.score<3) return;
        add(l.i,'dup',f.why+'：…'+snip(body.slice(Math.max(0,f.at-8)),26)+
          (f.fix?'　→ '+f.fix:''),'err');
      });
    });
  });

  /* --- レス番号：昇順・重複・突出・飛ばし幅・1000 --- */
  const nums=A.threadBlocks.filter(b=>b.num!==null);
  let base=null,prevB=null,warnedNear=false,warnedOver=false,lastDatedMeta=null;
  nums.forEach((b,k)=>{
    const cur=b.num;
    if(cur===1){ base=1; prevB=b; return; }
    if(base===null){ base=cur; prevB=b; return; }
    if(cur>base){
      const nxt=nums[k+1]?nums[k+1].num:null;
      if(nxt!==null&&nxt!==1&&cur>nxt&&nxt>base){
        add(b.head.i,'resnum','レス番号が突出しています：'+cur+'（前後の '+base+' → '+nxt+' から外れています）');
      }else{
        // 飛ばし幅は「時間が動いた箇所」だけを見る。
        // 連続する投稿の +1〜+数 は通常の会話の流れなので対象にしない。
        const gap=cur-base;
        const gr=gapRange((b.meta&&b.meta.date&&lastDatedMeta)?lastDatedMeta:(prevB?prevB.meta:null),b.meta,cfg);
        const timed=(gr.why!=='通常');
        if(timed&&gap<gr.range[0]){
          add(b.head.i,'resnum',gr.why+'なのに飛ばし幅が'+gap+'です（'+gr.range[0]+'〜'+gr.range[1]+'に）');
        }else if(!timed&&gap>cfg.jumpHint){
          add(b.head.i,'resnum','番号が'+gap+'飛んでいます。時間が動いたなら @@日付@@ か ++※N時間後++ を入れてください','warn');
        }
      }
      base=cur; prevB=b;
    }else{
      add(b.head.i,'resnum','レス番号異常：'+base+' の後に '+cur+' が出ています（昇順でない／重複）');
      prevB=b;
    }
    if(b.meta&&b.meta.date) lastDatedMeta=b.meta;
    if(cur>1000&&!warnedOver){ warnedOver=true;
      add(b.head.i,'resnum','1000番を超えています。新しいスレに移ってください'); }
    else if(cur>=880&&!warnedNear){ warnedNear=true;
      add(b.head.i,'resnum','1000番が近づいています（現在'+cur+'番）。移行の準備を','warn'); }
  });
  // 1〜8は連番
  const small=nums.filter(b=>b.num<=8).map(b=>b.num);
  for(let k=1;k<small.length;k++){
    if(small[k]!==small[k-1]+1){
      const b=nums.find(x=>x.num===small[k]);
      if(b) add(b.head.i,'resnum','1〜8は連番にしてください（'+small[k-1]+' → '+small[k]+'）');
    }
  }
  // 日付ベースの新スレ判定
  const dated=nums.filter(b=>b.meta.date);
  for(let k=1;k<dated.length;k++){
    if(dated[k].num<dated[k-1].num) continue;
    const days=Math.round((dated[k].meta.date-dated[k-1].meta.date)/86400000);
    if(days>=60) add(dated[k].head.i,'structure',Math.round(days/30)+'か月ほど経過しています。新しいスレを立て直してください（必須）');
    else if(days>=30) add(dated[k].head.i,'structure',days+'日経過しています。新しいスレの検討を（推奨）');
  }

  /* --- アンカー --- */
  const exist=new Set(nums.map(b=>b.num));
  A.scope.forEach((l,k)=>{
    if(l.type!=='thread') return;
    const m=l.inner.match(RE_ANCHOR);
    if(!m) return;
    if(!exist.has(+m[1])) add(l.i,'resnum','>>'+m[1]+' は本編に存在しない番号です');
    if(l.inner.replace(RE_ANCHOR,'').trim()!=='')
      add(l.i,'resnum','アンカーの後は改行してください：'+snip(l.inner,40));
  });

  /* --- スレ構造 --- */
  const seq=[];
  A.scope.forEach(l=>{
    if(l.type==='body') seq.push({k:'body',l});
    else if(l.type==='thread'||l.type==='img'){
      const prev=seq[seq.length-1];
      const who=l.type==='img'?'img':(l.inner.match(RE_NUMLINE)?l.inner.match(RE_NUMLINE)[2]:null);
      if(prev&&prev.k==='post'&&who===null) return; // 投稿の続きの行
      if(who!==null) seq.push({k:'post',who,l});
    }
  });
  const posts=[];
  seq.forEach((s,k)=>{ if(s.k==='post') posts.push({...s,at:k}); });
  for(let k=0;k<posts.length;k++){
    const p=posts[k];
    if(p.who!=='イッチ') continue;
    const before=seq[p.at-1], after=seq[p.at+1];
    if(before&&before.k==='post'&&before.who!=='img')
      add(p.l.i,'structure','イッチの直前に本文がありません（イッチの前後には本文を挟みます）');
    if(after&&after.k==='post'&&after.who!=='img')
      add(p.l.i,'structure','イッチの直後に本文がありません（イッチの前後には本文を挟みます）');
    const nx=posts[k+1];
    if(nx&&nx.who==='イッチ'&&nx.at===p.at+1)
      add(nx.l.i,'structure','イッチが連続で投稿しています（1回にまとめます）');
  }
  let run=0,runStart=null;
  seq.forEach(s=>{
    if(s.k==='post'&&s.who==='名無し'){ if(run===0)runStart=s; run++;
      if(run===7) add(s.l.i,'structure','スレ民の投稿が7件以上続いています（6件まで）');
    } else if(s.k!=='post'||s.who!=='img'){ run=0; }
  });

  /* --- スレ民／スレ民たち --- */
  let sureRun=0;
  A.scope.forEach((l,k,arr)=>{});
  {
    let i=0;
    const sc=A.scope;
    while(i<sc.length){
      const l=sc[i];
      if(l.type==='blank'||l.type==='head'){ i++; continue; }
      if(l.type==='thread'||l.type==='img'){
        const isImg=l.type==='img';
        const start=i;
        while(i<sc.length&&(sc[i].type==='thread'||sc[i].type==='img')) i++;
        if(!isImg) sureRun++;
        continue;
      }
      let txt='',first=l.i;
      while(i<sc.length&&sc[i].type==='body'){ txt+=sc[i].inner; i++; }
      if(txt.includes('スレ民')){
        const stripped=txt.replace(/スレ民たち/g,'');
        if(sureRun>=2&&stripped.includes('スレ民'))
          add(first,'suremember','直前のスレ投稿が'+sureRun+'件続くため「スレ民たち」が適切です');
        if(sureRun===1&&txt.includes('スレ民たち'))
          add(first,'suremember','直前のスレ投稿が1件のため「スレ民」（単数）が適切です');
      }
      sureRun=0;
    }
  }

  /* --- 空行の連続 --- */
  {
    let run=0,start=-1;
    for(let k=A.from;k<A.to;k++){
      if(String(lines[k]||'').trim()===''){ if(run===0) start=k; run++; }
      else{ if(run>=2) add(start,'length','空行が'+run+'行続いています（1行にしてください）'); run=0; }
    }
    if(run>=2) add(start,'length','空行が'+run+'行続いています（1行にしてください）');
  }

  /* --- 次回予告 --- */
  const ni=lines.findIndex(s=>/ここから次回予告/.test(s));
  if(ni>=0){
    for(let k=ni+1;k<lines.length;k++){
      const s=strip(lines[k]).trim();
      if(!s) continue;
      const m=s.match(/^(\d+)\s*[:：]\s*(.*)$/);
      const val=m?m[2].trim():s;
      if(/^画像$/.test(val)||/^次回/.test(val)) continue;
      const lk=detectFusejiLeak(val);
      if(lk.length) add(k,'fuseji','次回予告に伏字対象 ['+lk.map(x=>x.w).join('・')+']：'+snip(val,30));
      const parts=val.split('／');
      parts.forEach(p=>{ if(p.trim().length>8) add(k,'length','次回予告は8文字以内です（'+p.trim().length+'字）：'+snip(p,20)); });
      const am=val.match(/^>>(\d+)/);
      if(am&&!exist.has(+am[1])) add(k,'resnum','次回予告の >>'+am[1]+' は本編に存在しません');
    }
  }

  const SEV={err:0,warn:1,info:2};
  hits.sort((a,b)=>SEV[a.sev]-SEV[b.sev]||a.i-b.i||KIND_ORDER.indexOf(a.kind)-KIND_ORDER.indexOf(b.kind));
  return hits;
}

/* ---------- 字数 ---------- */
function countChars(lines){
  const ni=lines.findIndex(s=>/ここから次回予告/.test(s));
  const use=ni>=0?lines.slice(0,ni):lines;
  let n=0;
  for(const raw of use){
    if(lineType(raw)==='head') continue;
    n+=strip(raw).replace(/[\s\u3000]/g,'').length;
  }
  return n;

/* ---------- レス番号の振り直し ---------- */
function renumber(lines,cfg){
  const A=analyze(lines);
  const blocks=A.threadBlocks.filter(b=>b.num!==null);
  const map=new Map();      // 旧番号 → 新番号
  const plan=[];
  let cur=0,prevMeta=null,overflow=null;
  blocks.forEach((b,k)=>{
    let next;
    if(cur===0) next=1;
    else if(cur<8) next=cur+1;                       // 1〜8は連番
    else{
      const gr=gapRange(prevMeta,b.meta,cfg);
      next=cur+pick(gr.range);
    }
    if(next>1000&&!overflow) overflow={at:b.head.i,prev:cur,next};
    map.set(b.num,next);
    plan.push({i:b.head.i,from:b.num,to:next,who:b.who});
    cur=next; prevMeta=b.meta;
  });
  if(overflow) return {ok:false,overflow,plan};

  const out=lines.slice();
  blocks.forEach(b=>{
    out[b.head.i]=out[b.head.i].replace(RE_NUMLINE, (mm,n,who,rest)=>map.get(+n)+'.'+who+rest);
    // 太字記号の内側で置換されるよう、記号ごと保持した形で再構成
  });
  // アンカーの追従
  for(let i=0;i<out.length;i++){
    out[i]=out[i].replace(/>>(\d+)/g,(mm,n)=>map.has(+n)?'>>'+map.get(+n):mm);
  }
  return {ok:true,lines:out,plan};
}

const SPEAK_SUB=[
  [/ｗ+/g,''],[/w{2,}/g,''],[/^草$/,'くさ'],
  [/ｷﾀ[ー―\-]+\([^)]*\)[ー―\-]+!*/g,'キター'],
  [/\([^)]*[ﾟ°Д´ω・∀][^)]*\)/g,''],
  [/>>(\d+)/g,'$1番へ、'],
];
function speakText(raw,opt){
  opt=opt||{};
  let s=strip(raw);
  // 読み方の辞書（先に長い語から当てる）
  if(opt.dict&&opt.dict.length){
    for(const [from,to] of opt.dict){ if(from) s=s.split(from).join(to); }
  }
  s=s.replace(/●([\u3040-\u309F\u4E00-\u9FFF々]*)[（(]([^（）()]*)[）)]/g,'$2');
  s=s.replace(/●/g,'');
  if(opt.readNum!==false) s=s.replace(RE_NUMLINE,(m,n,who)=>n+'番、'+who+'。');
  else s=s.replace(RE_NUMLINE,'');
  for(const [re,to] of SPEAK_SUB) s=s.replace(re,to);
  s=s.replace(/[\u3000\s]+/g,' ').trim();
  return s;
}
function speakQueue(lines,mode,dict){
  const q=[];
  const d=(dict||[]).slice().sort((a,b)=>String(b[0]).length-String(a[0]).length);
  lines.forEach((raw,i)=>{
    const t=lineType(raw);
    if(t==='blank'||t==='head') return;
    if(t==='img') return;
    if(mode==='body'&&t!=='body') return;
    if(mode==='thread'&&t==='body') return;
    const s=speakText(raw,{readNum:mode!=='body',dict:d});
    if(s) q.push({i,text:s,type:t});
  });
  return q;
}

/* ---------- 貼り付けの解釈 ---------- */
/** Googleドキュメント等のHTMLから ** @@ ++ を組み立て直す。
 *  ドキュメントは全体を <b style="font-weight:normal"> で包むため、
 *  祖先に B があるかではなく「最も近い明示的な太さ」で判定する。 */
function boldOf(node,root){
  let el=node.nodeType===1?node:node.parentElement;
  while(el&&el!==root&&el.nodeType===1){
    const w=(el.style&&el.style.fontWeight)||'';
    if(w){
      if(w==='normal'||w==='lighter') return false;
      if(w==='bold'||w==='bolder') return true;
      const n=parseInt(w,10);
      if(!isNaN(n)) return n>=600;
    }
    if(el.tagName==='B'||el.tagName==='STRONG') return true;
    el=el.parentElement;
  }
  return false;
}
function styleOf(node,root,prop){
  let el=node.nodeType===1?node:node.parentElement;
  while(el&&el!==root&&el.nodeType===1){
    const v=el.style&&el.style[prop];
    if(v) return v;
    el=el.parentElement;
  }
  return '';
}
function htmlToScript(html){
  const doc=new DOMParser().parseFromString(html,'text/html');
  const root=doc.body;
  const norm=c=>{
    c=String(c||'').trim().toLowerCase();
    const a=c.match(/rgba\(\s*\d+\s*,\s*\d+\s*,\s*\d+\s*,\s*([\d.]+)\s*\)/);
    if(a&&+a[1]===0) return 'transparent';
    const m=c.match(/rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/);
    if(m) return '#'+[m[1],m[2],m[3]].map(x=>(+x).toString(16).padStart(2,'0')).join('');
    if(/^#[0-9a-f]{3}$/.test(c)) return '#'+c[1]+c[1]+c[2]+c[2]+c[3]+c[3];
    return c;
  };
  const BGS=new Set(['#ffff00',norm(FX.atBg),norm(FX.ppBg)]);
  const FGS=new Set(['#ff0000',norm(FX.ppFg)]);
  const isYellow=c=>BGS.has(norm(c));
  const isRed=c=>FGS.has(norm(c));
  const BLOCK='p,div,li,h1,h2,h3,h4,h5,h6,tr';
  // 文書の並び順で、末端の段落と「段落の外に置かれた <br>」を拾う
  // <br> は、段落の中にあれば行内の改行、段落を並べた入れ物の中にあれば空行
  const isGapBr=b=>{ const c=b.closest(BLOCK); return !c||!!c.querySelector(BLOCK); };
  const blocks=[...root.querySelectorAll(BLOCK+',br')].filter(b=>
    b.tagName==='BR' ? isGapBr(b) : !b.querySelector(BLOCK));
  const hasBlock=blocks.some(b=>b.tagName!=='BR');
  const list=hasBlock?blocks:[root];
  const out=[];
  for(const b of list){
    if(b.tagName==='BR'){ out.push(''); continue; }   // 段落の外の <br> は空行
    // 1段落＝1行。段落の中の <br> だけを追加の改行として扱う。
    let text='',boldLen=0,plainLen=0,letters=0;
    const walk=n=>{
      if(n.nodeType===3){
        const t=n.nodeValue; if(!t) return;
        const vis=t.replace(/\u00a0/g,' ');
        if(vis.trim()){
          letters+=vis.trim().length;
          if(boldOf(n,root)) boldLen+=vis.trim().length; else plainLen+=vis.trim().length;
        }
        const bgc=styleOf(n,root,'backgroundColor'), fgc=styleOf(n,root,'color');
        const nb=norm(bgc), nf=norm(fgc);
        const HEXC=/^#[0-9a-f]{6}$/;
        const fgPlain=!HEXC.test(nf)||nf==='#000000';
        const bgPlain=!HEXC.test(nb)||nb==='#ffffff';
        if(isYellow(bgc)&&(fgPlain||isRed(fgc))){
          const mk=isRed(fgc)?'++':'@@';
          text+=mk+vis+mk;
        }else if(!fgPlain||!bgPlain){
          text+='{{'+attrStr(fgPlain?null:nf,bgPlain?null:nb)+'|'+vis+'}}';
        }else text+=vis;
        return;
      }
      if(n.nodeType===1){
        if(n.tagName==='BR'){ text+='\n'; return; }
        for(const c of n.childNodes) walk(c);
      }
    };
    walk(b);
    // 中身が空白だけの段落は、<br> があっても空行ひとつとして数える。
    // （ドキュメントは空行を <p><span><br></span></p> と書き出すため）
    if(letters===0){ out.push(''); continue; }
    text=text.replace(/\u00a0/g,' ').replace(/(@@|\+\+)\s*\1/g,'');
    const bold=boldLen>plainLen;
    text.split('\n').forEach(piece=>{
      if(strip(piece).trim()===''){ out.push(''); return; }
      const tidy=serializeInner(parseInner(bold?piece.trim():piece.replace(/\s+$/,'')));
      out.push(bold?'**'+tidy+'**':tidy);
    });
  }
  return out.join('\n');
}

/** 書式から作った行と、素のテキストの行を突き合わせる。
 *  改行の位置は素のテキストを正とし、書式は「中身」だけを受け取る。
 *  ドキュメントのHTMLは空段落の書き方が版や設定で変わるため、
 *  改行の判断をHTMLに任せない。 */
function mergeWithPlain(htmlLines,plainText){
  if(!plainText) return htmlLines;
  const plain=String(plainText).replace(/\r\n?/g,'\n').split('\n');
  const rich=htmlLines.filter(x=>String(x).trim()!=='');
  const need=plain.filter(x=>x.trim()!=='').length;
  if(rich.length!==need) return null;          // 数が合わないときは使わない
  const out=[]; let k=0;
  for(const p of plain) out.push(p.trim()===''?'':rich[k++]);
  return out;
}

/** 書式付きコピー用のHTML。
 *  ドキュメントの既定フォントに合わせて Arial を指定する。
 *  空行は、Googleドキュメント自身がコピー時に使う形（段落と段落の間の <br>）で書き出す。
 *  空白文字を入れると、ドキュメント側に半角スペースとして残ってしまうため。 */
const DOC_FONT='Arial, "Yu Gothic", "Hiragino Sans", "Meiryo", sans-serif';
/** 効果の色。書き出しと読み込みの両方で使う。 */
const FX={atBg:'#ffff00',ppBg:'#ffff00',ppFg:'#ff0000'};
function setFxColors(c){ if(c){ ['atBg','ppBg','ppFg'].forEach(k=>{ if(c[k]) FX[k]=c[k]; }); } }
function scriptToHtml(lines,lh){
  const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const LH=(lh&&lh>0)?lh:1.15;
  const P='margin:0;padding:0;line-height:'+LH+';font-family:'+DOC_FONT+';font-size:11pt';
  const body=lines.map(raw=>{
    if(String(raw).trim()===''){ return '<br>'; }
    const ty=lineType(raw);
    const bold=(ty==='thread'||ty==='img');
    const html=groupsOf(parseInner(unbold(raw))).map(g=>{
      const t=esc(g.t);
      if(g.fx==='at') return '<span style="background-color:'+FX.atBg+'">'+t+'</span>';
      if(g.fx==='pp') return '<span style="background-color:'+FX.ppBg+';color:'+FX.ppFg+'">'+t+'</span>';
      if(g.fg||g.bg){
        return '<span style="'+(g.fg?'color:'+g.fg+';':'')+(g.bg?'background-color:'+g.bg+';':'')+'">'+t+'</span>';
      }
      return t;
    }).join('');
    return '<p style="'+P+'">'+(bold?'<b>'+html+'</b>':html)+'</p>';
  }).join('');
  return '<div style="font-family:'+DOC_FONT+';line-height:'+LH+'">'+body+'</div>';
}

/* ---------- レス番号の振り直し（範囲対応） ---------- */
/** from/to は行番号の範囲。省略すると全体。
 *  範囲を指定した場合、直前の番号と直後の番号の間に収まるよう配置する。 */
function renumberRange(lines,cfg,from,to){
  cfg=Object.assign({},cfg);
  const A=analyze(lines);
  const all=A.threadBlocks.filter(b=>b.num!==null);
  const whole=(from==null||to==null);
  const target=whole?all:all.filter(b=>b.head.i>=from&&b.head.i<=to);
  if(!target.length) return {ok:false,reason:'empty'};

  // 範囲を選んだときは、その範囲に元からある番号の最小〜最大の中で振り直す。
  // 範囲の外は一切動かさないので、前後との辻褄が必ず合う。
  let lo,hi,before=null;
  if(whole){ lo=0; hi=null; }
  else{
    const ns=target.map(b=>b.num);
    before=all.filter(b=>b.head.i<from).pop();
    const after=all.filter(b=>b.head.i>to)[0];
    // 下限は「範囲の直前の番号」。無ければ範囲内の最小の1つ手前。
    lo=before?before.num:Math.max(0,Math.min(...ns)-1);
    // 上限は「範囲の直後の番号」。無ければ範囲内の最大の1つ先。
    hi=after?after.num:Math.max(...ns)+1;
  }

  const map=new Map(),plan=[];
  let cur=lo,prevMeta=before?before.meta:null;
  // 日付は直前の行ではなく「最後に日付が書かれた行」と比べる。
  // 地の文で時間を飛ばし、次の番号行に日付だけ書く形に合わせるため。
  let lastDated=null;
  for(const b of all){ if(b.head.i>=from) break; if(b.meta&&b.meta.date) lastDated=b.meta; }
  for(let k=0;k<target.length;k++){
    const b=target[k];
    const basis=(b.meta&&b.meta.date&&lastDated)?lastDated:prevMeta;
    const remain=target.length-k-1;           // 自分より後に置く件数
    let next;
    const gr=gapRange(basis,b.meta,cfg);
    if(cur===0) next=1;
    // 1〜8は連番。ただし時間が飛んでいる場合はそちらを優先する
    else if(cur<8&&gr.why==='通常') next=cur+1;
    else next=cur+(gr.why==='通常'?pickWeighted(gr.range,cfg.gapWeights):pick(gr.range));
    if(hi!==null){
      const max=hi-1-remain;                  // 後続が最低1ずつ入る余地を残す
      if(cur+1>max) return {ok:false,reason:'tight',lo,hi,need:target.length};
      if(next>max) next=Math.max(cur+1,max);
    }
    if(next>1000&&hi===null) return {ok:false,reason:'over',overflow:{at:b.head.i,prev:cur,next}};
    map.set(b.num,next);
    plan.push({i:b.head.i,from:b.num,to:next,who:b.who});
    cur=next; prevMeta=b.meta;
    if(b.meta&&b.meta.date) lastDated=b.meta;
  }
  const out=lines.slice();
  target.forEach(b=>{ out[b.head.i]=setNumber(out[b.head.i],map.get(b.num)); });
  for(let i=0;i<out.length;i++){
    out[i]=out[i].replace(/>>(\d+)/g,(mm,n)=>map.has(+n)?'>>'+map.get(+n):mm);
  }
  return {ok:true,lines:out,plan,range:whole?null:[from,to]};
}

/* ---------- 見出し（アウトライン） ---------- */
function outline(lines){
  const r=[];
  lines.forEach((raw,i)=>{
    const ty=lineType(raw);
    if(ty==='head'){ r.push({i,kind:'head',text:strip(raw).trim()}); return; }
    if(ty!=='thread') return;
    const m=strip(raw).trim().match(RE_NUMLINE);
    if(m) r.push({i,kind:'num',num:+m[1],who:m[2],text:m[1]+'.'+m[2]});
  });
  return r;
}

/* ---------- 検索と置換 ---------- */
function findAll(lines,q,opt){
  opt=opt||{};
  if(!q) return [];
  const res=[];
  const needle=opt.caseSensitive?q:q.toLowerCase();
  lines.forEach((raw,i)=>{
    const hay=opt.withMarks?raw:strip(raw);
    const h=opt.caseSensitive?hay:hay.toLowerCase();
    let from=0,idx;
    while((idx=h.indexOf(needle,from))!==-1){ res.push({i,at:idx}); from=idx+Math.max(1,needle.length); }
  });
  return res;
}
function replaceAll(lines,q,to,opt){
  opt=opt||{};
  let n=0;
  const out=lines.map(raw=>{
    if(!raw.includes(q)) return raw;
    n+=raw.split(q).length-1;
    return raw.split(q).join(to);
  });
  return {lines:out,count:n};
}
