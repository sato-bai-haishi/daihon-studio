  q('#s-dict').value=(S.cfg.speak.dict||[]).map(p=>p[0]+'＝'+p[1]).join('\n');

  const before=JSON.stringify({s:S.cfg.badStyle,a:S.cfg.badAlpha,b:S.cfg.badBar,c:S.cfg.colors});
  const v=await dialog('設定',box,[{t:'取消',v:null},{t:'保存',v:'ok',primary:true}]);
  if(v!=='ok'){
    applyLook();
    const b=JSON.parse(before);
    S.cfg.badStyle=b.s; S.cfg.badAlpha=b.a; S.cfg.badBar=b.b; S.cfg.colors=b.c;
    applyLook(); paintHits(); renderHits(); return;
  }
  S.cfg.font=q('#f-font').value; S.cfg.size=+q('#f-size').value||16; S.cfg.refSize=+q('#f-ref').value||14;
  S.cfg.lh=Math.min(3,Math.max(1,+q('#f-lh').value||1.15)); S.cfg.lhSet=true;
  S.cfg.fx={atBg:q('#fx-at').value,ppBg:q('#fx-ppb').value,ppFg:q('#fx-ppf').value};
  S.cfg.guide=q('#f-guide').checked; S.cfg.refOn=q('#f-refon').checked;
  S.cfg.speak.engine=q('#s-eng').value;
  S.cfg.speak.mode=q('#s-mode').value; S.cfg.speak.bodyVoice=q('#s-v1').value; S.cfg.speak.threadVoice=q('#s-v2').value;
  S.cfg.speak.vvUrl=q('#s-url').value.trim();
  S.cfg.speak.gapMs=Math.max(0,Math.min(5000,+q('#s-gap').value||0));
  if(q('#s-vv1').value) S.cfg.speak.vvBody=+q('#s-vv1').value;
  if(q('#s-vv2').value) S.cfg.speak.vvThread=+q('#s-vv2').value;
  vvCache.clear(); vvPending.clear();
  S.cfg.speak.rate=+q('#s-rate').value/10; S.cfg.speak.volume=+q('#s-vol').value/100; S.cfg.speak.pitch=+q('#s-pit').value/10;
  box.querySelectorAll('#p-dic textarea[data-d]').forEach(t=>{
    DICT[t.dataset.d]=t.value.split('\n').map(x=>x.trim()).filter(Boolean);
  });
  DICT.dupExtra=q('#d-extra').value.split('\n').map(l=>{
    const p=l.split(/[＝=]/).map(x=>x.trim());
    if(!p[0]) return null;
    let pat=p[0];
    if(pat.length>2&&pat.startsWith('/')&&pat.endsWith('/')){
      try{ pat=new RegExp(pat.slice(1,-1)); }catch(e){ return null; }
    }
    return [pat,p[1]||'不自然な重なりです',p[2]||'',3];
  }).filter(Boolean);
  const num=id=>+q(id).value||0;
  S.cfg.gap={normal:[num('#g1'),num('#g2')],hours:[num('#g3'),num('#g4')],
             nextday:[num('#g5'),num('#g6')],days:[num('#g7'),num('#g8')]};
  S.cfg.jumpHint=num('#g9')||10;
  const nw={};
  gw.querySelectorAll('input').forEach(i2=>{ nw[i2.dataset.n]=Math.max(0,+i2.value||0); });
  S.cfg.gapWeights=nw;
  S.cfg.speak.dict=q('#s-dict').value.split('\n').map(l=>{
    const m=l.split(/[＝=]/);
    return (m.length>=2&&m[0].trim())?[m[0].trim(),m.slice(1).join('=').trim()]:null;
  }).filter(Boolean);
  S.cfg.assist.emptyLine=q('#a-empty').checked;
  S.cfg.assist.keepBold=q('#a-keep').checked;
  S.cfg.assist.autoEffect=q('#a-eff').checked;
  S.cfg.askNote=q('#a-note').checked;
  applyLook(); save(); runCheck(); renderRef();
}
function rgbToHex(c){
  c=String(c).trim();
  if(c.startsWith('#')) return c.length===4?'#'+c[1]+c[1]+c[2]+c[2]+c[3]+c[3]:c;
  const m=c.match(/\d+/g);
  return m?'#'+m.slice(0,3).map(x=>(+x).toString(16).padStart(2,'0')).join(''):'#888888';
}

/* ================== 状態バー ================== */
function updateStatus(){
  const b=$('#status'); b.textContent='';
  const add=t=>{const s=el('span');s.innerHTML=t;b.append(s)};
  const n=countChars(lines);
  const i=curLineIndex();
  add(ST().name+' <b>'+n.toLocaleString()+'</b> 字');
  const rg=selectedRange();
  if(rg&&rg[0]!==rg[1]) add('選択 <b>'+countChars(lines.slice(rg[0],rg[1]+1)).toLocaleString()+'</b> 字');
  else if(i>=0) add('ここまで <b>'+countChars(lines.slice(0,i+1)).toLocaleString()+'</b> 字');
  const nums=analyze(lines).threadBlocks.filter(x=>x.num!==null).map(x=>x.num);
  if(nums.length) add('レス番号 '+Math.min(...nums)+'〜'+Math.max(...nums));
  add('全'+lines.length+'行');
  add(MODE()==='marks'?'記号あり':'記号なし');
  if(ST().check&&!paused){
    const open=hits.filter(h=>h.st==='open');
    const e=open.filter(h=>h.sev==='err').length, w=open.filter(h=>h.sev!=='err').length;
    const p=el('span','pill'+(e?' bad':''));
    p.textContent=open.length?('エラー'+e+' / 注意'+w):'指摘なし';
    b.append(p);
  }
}

/* ================== 起動 ================== */
['#fc-fg','#fc-bg'].forEach(id=>{
  const b=$(id);
  b.addEventListener('mousedown',e=>e.preventDefault());   // 押しても選択を消さない
  b.onclick=()=>{ if($('#palette')){ closePalette(); return; } openPalette(id==='#fc-fg'?'fg':'bg',b); };
});
$('#fc-clear').addEventListener('mousedown',e=>e.preventDefault());
$('#fc-clear').onclick=()=>{
  const sr=selectedRaw();
  if(!sr){ toast('色を外す文字を選んでください'); return; }
  colorSel=sr;
  if(applyColors({fg:null,bg:null})) toast('色を外しました');
  colorSel=null;
};
$('#b-open').onclick=()=>$('#filein').click();
$('#b-save').onclick=saveFile;
$('#b-copy').onclick=copyMenu;
$('#b-paste').onclick=pasteIn;
if($('#b-paste-plain')) $('#b-paste-plain').onclick=pastePlain;
$('#b-all').onclick=selectAll;
$('#b-mode').onclick=toggleMode;
$('#b-num').onclick=()=>insertNumber(false);
$('#b-renum').onclick=doRenumber;
$('#b-mark').onclick=toggleMark;
$('#b-find').onclick=openFind;
$('#b-speak').onclick=toggleSpeak;
$('#b-ver').onclick=versionMenu;
$('#b-set').onclick=settings;
$('#b-pause').onclick=()=>{paused=!paused;$('#b-pause').classList.toggle('on',paused);runCheck();renderHits()};
$('#ck-on').onchange=e=>{ ST().check=e.target.checked; save(); runCheck(); };
document.querySelectorAll('.stab').forEach(t=>t.onclick=()=>showSide(t.dataset.t));
function showSide(t){
  S.cfg.side=t; save();
  document.querySelectorAll('.stab').forEach(x=>x.classList.toggle('on',x.dataset.t===t));
  document.querySelectorAll('.sbody').forEach(x=>x.classList.toggle('on',x.id==='sb-'+t));
  if(t==='mark') renderMarks();
  if(t==='out') renderOutline();
  if(t==='find') renderFind();
}
document.addEventListener('selectionchange',()=>{ if(document.activeElement===ED) updateStatus(); });

load();
applyLook();
paintSwatches();
renderWorks();
loadStage();
showSide(S.cfg.side||'chk');
if(_pending) setTimeout(()=>toast(_pending),300);
migrateToBig();
window.addEventListener('beforeunload',()=>{
  ST().text=lines.join('\n');
  try{ localStorage.setItem(LS,JSON.stringify(S)); }catch(e){}
});



</script>
