 *  画面が古い状態でクリックされても、指し先が消えないようにする。 */
function W(){
  if(!S.works.length) S.works=[newWork('台本1')];
  if(!(S.aw>=0&&S.aw<S.works.length)) S.aw=0;
  const w=S.works[S.aw];
  if(!w.stages||!w.stages.length) w.stages=[newStage('本編')];
  return w;
}
function ST(){
  const w=W();
  if(!(w.as>=0&&w.as<w.stages.length)) w.as=w.stages.length-1;
  return w.stages[w.as];
}
const MODE=()=>ST().mode||'plain';

function load(){
  try{
    const j=JSON.parse(localStorage.getItem(LS));
    if(j&&j.works&&j.works.length){
      S.works=j.works; S.aw=j.aw||0;
      S.cfg=Object.assign(S.cfg,j.cfg||{});
      // 古い版（キーが文字列）からの移行
      const mk=Object.assign(JSON.parse(JSON.stringify(DEF_KEYS)),S.cfg.keys||{});
      for(const a in mk) mk[a]=Array.isArray(mk[a])?mk[a].filter(x=>typeof x==='string'):(typeof mk[a]==='string'?[mk[a]]:[]);
      S.cfg.keys=mk;
      S.cfg.speak=Object.assign({rate:1,volume:1,pitch:1,bodyVoice:'',threadVoice:'',mode:'body',engine:'web',vvUrl:'',vvBody:1,vvThread:3,gapMs:400,dict:[]},S.cfg.speak||{});
      S.works.forEach(w=>w.stages.forEach(s=>{
        s.mode=s.mode||'plain'; s.done=s.done||[]; s.exc=s.exc||[];
        s.marks=s.marks||[]; s.speakAt=s.speakAt||0; if(!s.id) s.id=uid();
      }));
    }
    if(j&&j.cfg&&j.cfg.dict){
      Object.assign(DICT,j.cfg.dict);
      // 保存した追加パターンの正規表現を組み立て直す
      if(Array.isArray(DICT.dupExtra)) DICT.dupExtra=DICT.dupExtra.map(r=>{
        if(!Array.isArray(r)) return null;
        let pat=r[0];
        if(typeof pat==='object'&&pat&&pat.source){ try{ pat=new RegExp(pat.source,pat.flags||''); }catch(e){ return null; } }
        return [pat,r[1],r[2],r[3]||3];
      }).filter(Boolean);
    }
    // 保存済み辞書の手入れ（版が上がったときだけ一度だけ走る）
    if((S.cfg.dictVer||0)<3){
      DICT.kanjiExempt=(DICT.kanjiExempt||[]).filter(w=>!['一人','二人','三人','一人一人'].includes(w));
    }
    if((S.cfg.dictVer||0)<2){
      const drop=['その','この','そんな','これを','これら','どうやら'];
      DICT.approved=(DICT.approved||[]).filter(w=>!drop.includes(w));
      const add=['なんという','なんとも','なんとなく','まずは'];
      DICT.headDeny=(DICT.headDeny||[]).concat(add.filter(w=>!(DICT.headDeny||[]).includes(w)));
      S.cfg.dictVer=2;
    }
    S.cfg.dictVer=Math.max(3,S.cfg.dictVer||0);
  }catch(e){ toastLater('設定を読み込めなかったため、既定に戻しました'); }
  // 数値まわりの正規化（古い設定や壊れた値でも設定画面が開けるように）
  const c=S.cfg, nz=(v,d,lo,hi)=>{
    if(v===null||v===undefined||v==='') return d;
    const n=Number(v);
    return isFinite(n)?Math.min(hi,Math.max(lo,n)):d;
  };
  c.size=nz(c.size,16,9,34); c.refSize=nz(c.refSize,14,9,30);
  c.badAlpha=nz(c.badAlpha,0.16,0,0.6); c.badBar=nz(c.badBar,4,2,12);
  c.lh=nz(c.lh,1.15,1,3);
  if(!c.lhSet){ c.lh=1.15; }          // 自分で決めるまではドキュメントに合わせる
  c.jumpHint=nz(c.jumpHint,10,1,999);
  c.stagesW=nz(c.stagesW,170,90,400); c.sideW=nz(c.sideW,340,180,760); c.refH=nz(c.refH,240,70,2000);
  if(!['bar','under','both','fill'].includes(c.badStyle)) c.badStyle='bar';
  if(!FONTS.some(f=>f[1]===c.font)) c.font=DOC_FONT_VALUE;
  if(!c.colors||typeof c.colors!=='object') c.colors={};
  if(!c.gapWeights||typeof c.gapWeights!=='object') c.gapWeights={};
  const hex=v=>/^#[0-9a-fA-F]{6}$/.test(String(v||''));
  c.fx=Object.assign({atBg:'#ffff00',ppBg:'#ffff00',ppFg:'#ff0000'},c.fx||{});
  ['atBg','ppBg','ppFg'].forEach(k=>{ if(!hex(c.fx[k])) c.fx[k]={atBg:'#ffff00',ppBg:'#ffff00',ppFg:'#ff0000'}[k]; });
  const g=c.gap||{}; c.gap={
    normal:Array.isArray(g.normal)?g.normal:[3,10], hours:Array.isArray(g.hours)?g.hours:[10,20],
    nextday:Array.isArray(g.nextday)?g.nextday:[30,50], days:Array.isArray(g.days)?g.days:[50,100]};
  const sp=c.speak; sp.rate=nz(sp.rate,1,0.5,2.5); sp.volume=nz(sp.volume,1,0,1); sp.pitch=nz(sp.pitch,1,0.5,2);
  if(sp.engine!=='voicevox') sp.engine='web';
  sp.vvBody=nz(sp.vvBody,1,0,99999); sp.vvThread=nz(sp.vvThread,3,0,99999);
  sp.gapMs=nz(sp.gapMs,400,0,5000);
  if(!Array.isArray(sp.dict)) sp.dict=[];
  c.assist=Object.assign({emptyLine:false,keepBold:true,autoEffect:false,autoNumTime:false},c.assist||{});
  if(c.assistVer!==2){ c.assist.keepBold=true; c.assistVer=2; }
  if(!S.works.length) S.works=[newWork('台本1')];
  if(S.aw>=S.works.length) S.aw=0;
  if(W().as>=W().stages.length) W().as=0;
}
let saveT=null, snapT=null;
let _pending=null;
function toastLater(m){ _pending=m; }
/* ================== 便利 ================== */
const $=s=>document.querySelector(s);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
let toastT=null;
function toast(m){
  const t=$('#toast'); t.textContent=m; t.classList.add('on');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),2100);
}
function dialog(title,bodyNode,buttons){
  return new Promise(res=>{
    const d=document.createElement('dialog');
    // 押されたボタンの値を先に控える。close の合図がいつ届いても取り違えない。
    let picked=null, settled=false;
    const finish=v=>{ if(settled) return; settled=true; res(v); };
    const ft=el('div','dlg-ft');
    (buttons||[{t:'閉じる',v:null}]).forEach(b=>{
      const btn=el('button','btn',b.t);
      if(b.primary) btn.classList.add('on');
      btn.onclick=()=>{ picked=b.v; d.close(); finish(b.v); };
      ft.append(btn);
    });
    const bd=el('div','dlg-bd'); bd.append(bodyNode);
    d.append(el('div','dlg-hd',title),bd,ft); document.body.append(d);
    d.addEventListener('close',()=>{ d.remove(); finish(picked); },{once:true});
    d.showModal();
  });
}
const confirmBox=(title,msg,okLabel)=>dialog(title,el('p',null,msg),
  [{t:'取消',v:null},{t:okLabel||'実行',v:'ok',primary:true}]).then(v=>v==='ok');

/* ================== エディタ ================== */
const ED=$('#ed');
let lines=[], hits=[], hitByLine=new Map(), composing=false, paused=false;

function loadStage(){
  lastSig=null; clearMarkCache();
  lines=ST().text.split('\n');
  undoStack=[]; redoStack=[];
  renderAll(); renderStages(); renderRefSel();
  $('#ed-title').textContent=W().name+' ／ '+ST().name;
  $('#ck-on').checked=!!ST().check;
  $('#b-mode').textContent=MODE()==='marks'?'記号を隠す':'記号を表示';
  $('#b-mode').classList.toggle('on',MODE()==='marks');
  runCheck(); renderOutline(); renderMarks(); updateBoldState();
}
function renderAll(){
  // 3000行級でも一度に組み立てる（1行ずつ差し込むと極端に遅くなる）
  const buf=new Array(lines.length);
  const mode=MODE();
  for(let i=0;i<lines.length;i++){
    const raw=lines[i];
    const m=strip(raw||'').trim().match(RE_NUMLINE);
    buf[i]='<div class="ln t-'+lineType(raw)+'" data-i="'+i+'" data-g="'+(m?m[1]:'')+'">'
          +decorate(raw,mode)+'</div>';
  }
  ED.innerHTML=buf.join('');
  lastBad=new Set(); lastMark=new Set();
  paintMarks(); paintHits();
}
function makeLine(raw,i){
  const d=el('div','ln t-'+lineType(raw));
  d.dataset.i=i;
  d.innerHTML=decorate(raw,MODE());
  return d;
}
function redrawLine(i,keepOff){
  const d=ED.children[i]; if(!d) return;
  const off=keepOff!=null?keepOff:caretOffsetIn(d);
  d.className='ln t-'+lineType(lines[i]);
  d.innerHTML=decorate(lines[i],MODE());
  applyHit(d,i); applyMark(d,i);
  if(off!==null&&off!==undefined) setCaretIn(d,off);
}
function updateGutter(from,to){
  const a=from==null?0:Math.max(0,from), b=to==null?ED.children.length:Math.min(ED.children.length,to+1);
  for(let i=a;i<b;i++){
    const m=strip(lines[i]||'').trim().match(RE_NUMLINE);
    const g=m?m[1]:'';
    if(ED.children[i].dataset.g!==g) ED.children[i].dataset.g=g;
  }
}
function caretOffsetIn(node){
  const sel=getSelection(); if(!sel.rangeCount) return null;
  const r=sel.getRangeAt(0);
  if(!node.contains(r.startContainer)&&node!==r.startContainer) return null;
  const pre=r.cloneRange(); pre.selectNodeContents(node); pre.setEnd(r.startContainer,r.startOffset);
  return pre.toString().length;
}
function setCaretIn(node,off){
  const walk=document.createTreeWalker(node,NodeFilter.SHOW_TEXT);
  let n,acc=0;
  while((n=walk.nextNode())){
    const len=n.nodeValue.length;
    if(acc+len>=off){
      const r=document.createRange(); r.setStart(n,Math.max(0,off-acc)); r.collapse(true);
      const s=getSelection(); s.removeAllRanges(); s.addRange(r); return;
    }
    acc+=len;
  }
  const r=document.createRange(); r.selectNodeContents(node); r.collapse(false);
  const s=getSelection(); s.removeAllRanges(); s.addRange(r);
}
function curLineIndex(){
  const sel=getSelection(); if(!sel.rangeCount) return -1;
  let n=sel.getRangeAt(0).startContainer;
  if(n===ED) return Math.min(sel.getRangeAt(0).startOffset,ED.children.length-1);
  while(n&&n!==ED){ if(n.parentNode===ED) return [...ED.children].indexOf(n); n=n.parentNode; }
  return -1;
}
function focusLine(i,off){
  const d=ED.children[i]; if(!d) return;
  ED.focus(); setCaretIn(d,off==null?0:off);
  d.scrollIntoView({block:'center'}); markCurrent();
}
let curEl=null;
function markCurrent(){
  const i=curLineIndex();
  if(curEl) curEl.classList.remove('cur');
  curEl=ED.children[i]||null;
  if(curEl) curEl.classList.add('cur');
  updateBoldState(); updateStatus();
}
function updateBoldState(){
  const i=curLineIndex();
  let b=i>=0&&(lineType(lines[i])==='thread'||lineType(lines[i])==='img');
  // まだ文字の無い行でも、太字で書き始める状態なら太字として見せる
  if(i>=0&&!b&&ED.children[i]&&ED.children[i].classList.contains('t-thread')) b=true;
  const e=$('#boldstate');
  e.classList.toggle('is-bold',b);
  e.title=b?'いまは太字（スレ）':'いまは通常（本文）';
  e.textContent=b?'太字':'通常';
}

/* ---- 入力 ---- */
/** 空の行は表示のために <br> を置いている。
 *  そこへ日本語入力を始めると、最初の1文字が <br> の外に取り残されることがある。
 *  入力が始まる直前に <br> を外し、文字を受け取る場所を作っておく。 */
function prepareLineForInput(){
  const i=curLineIndex(); if(i<0) return;
  const d=ED.children[i]; if(!d) return;
  const br=d.querySelector('br');
  if(!br) return;
  if(d.textContent!=='') { br.remove(); return; }   // 文字があるのに <br> が残っている
  const tn=document.createTextNode('');
  d.replaceChild(tn,br);
  const r=document.createRange(); r.setStart(tn,0); r.collapse(true);
  const s=getSelection(); s.removeAllRanges(); s.addRange(r);
}
ED.addEventListener('beforeinput',e=>{
  if(e.inputType&&e.inputType.startsWith('delete')) return;
  prepareLineForInput();
});
ED.addEventListener('compositionstart',()=>{ prepareLineForInput(); composing=true; });
ED.addEventListener('compositionend',()=>{ composing=false; syncLine(); scheduleCheck(); });
ED.addEventListener('input',()=>{ if(composing) return; syncLine(); scheduleCheck(); });

function syncLine(){
  if(ED.children.length!==lines.length){
    // ブラウザ側で行が増減したとき。位置を控えてから組み直す。
    const i=curLineIndex(), off=i>=0?caretOffsetIn(ED.children[i]):0;
    pullAll(); renderAll(); afterEdit(); runCheck(); renderOutline();
    if(i>=0) focusLine(Math.min(i,lines.length-1),off||0);
    return;
  }
  const i=curLineIndex();
  if(i<0){ pullAll(); updateGutter(); afterEdit(); return; }
  const d=ED.children[i];
  const t=rawFromLine(d,MODE());
  if(t===lines[i]) return;
  pushUndo();
  lines[i]=t;
  // 記号なし表示で @@…@@ を打ち終えたら、その場で装飾へ変える
  if(S.cfg.assist.autoEffect&&MODE()!=='marks'&&/@@[^@]+@@|\+\+[^+]+\+\+/.test(t)){
    const off=caretOffsetIn(d);
    redrawLine(i, off==null?null:Math.max(0,off-4));
  }else{
    const off=caretOffsetIn(d);
    d.className='ln t-'+lineType(lines[i]);
    applyHit(d,i); applyMark(d,i);
    if(off!=null) setCaretIn(d,off);
  }
  updateGutter(i,i); afterEdit();
}
function pullAll(){ lines=[...ED.children].map(d=>rawFromLine(d,MODE())); }
function afterEdit(){ ST().text=lines.join('\n'); clearMarkCache(); save(); snapshot(); updateBoldState(); }

/* ---- 取り消し・やり直し（0.5秒でひとまとまり） ---- */
let undoStack=[], redoStack=[], lastPush=0;
function snapNow(){
  const i=curLineIndex();
  return {lines:lines.slice(),i,off:i>=0?caretOffsetIn(ED.children[i]):0};
}
function pushUndo(force){
  const now=Date.now();
  if(!force&&now-lastPush<500&&undoStack.length) { lastPush=now; return; }
  lastPush=now;
  undoStack.push(snapNow());
  if(undoStack.length>200) undoStack.shift();
  redoStack=[];
}
function applySnap(s){
  lines=s.lines.slice(); renderAll(); afterEdit(); runCheck(); renderOutline(); renderMarks();
  if(s.i>=0&&s.i<lines.length) focusLine(s.i,s.off||0);
}
function undo(){
  if(!undoStack.length){ toast('これ以上戻せません'); return; }
  redoStack.push(snapNow());
  applySnap(undoStack.pop());
}
function redo(){
  if(!redoStack.length){ toast('やり直せる操作がありません'); return; }
  undoStack.push(snapNow());
  applySnap(redoStack.pop());
}

/* ---- キー ---- */
function keyOf(e){
  const p=[];
  if(e.ctrlKey||e.metaKey) p.push('Ctrl');
  if(e.shiftKey) p.push('Shift');
  if(e.altKey) p.push('Alt');
  let k=e.key;
  if(k===' ') k='Space';
  if(k.length===1) k=k.toLowerCase();
  if(['Control','Shift','Alt','Meta'].includes(k)) return null;
  p.push(k); return p.join('+');
}
const ACTS={
  bold:()=>toggleBold(), num:()=>insertNumber(false), numTime:()=>insertNumber(true),
  mark:()=>toggleMark(), next:()=>jumpNextHit(), speak:()=>toggleSpeak(),
  at:()=>wrapEffect('@@'), pp:()=>wrapEffect('++'), mode:()=>toggleMode(),
  find:()=>openFind(), all:()=>selectAll(), up:()=>moveLine(-1), down:()=>moveLine(1),
  chk:()=>showSide('chk'), anchor:()=>jumpAnchor(),
  fgc:()=>openPalette('fg',$('#fc-fg')), bgc:()=>openPalette('bg',$('#fc-bg'))
};
document.addEventListener('keydown',e=>{
  const k=keyOf(e); if(!k) return;
  if(k==='Ctrl+z'){ e.preventDefault(); undo(); return; }
  if(k==='Ctrl+Shift+z'||k==='Ctrl+y'){ e.preventDefault(); redo(); return; }
  if(k==='F2'){ e.preventDefault(); jumpMark(e.shiftKey?-1:1); return; }
  for(const a in S.cfg.keys){
    if((S.cfg.keys[a]||[]).includes(k)){ e.preventDefault(); ACTS[a] && ACTS[a](); return; }
  }
},true);
ED.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!composing){ e.preventDefault(); splitLine(); return; }
  if(e.key==='Delete'&&!composing){
    const i=curLineIndex(); if(i<0) return;
    const sel=getSelection();
    if(!sel.isCollapsed) return;                      // 選択を消す場合は通常の処理へ
    const off=caretOffsetIn(ED.children[i]);
    if(off===shown(lines[i]).length){                 // 行末なら次の行を引き上げる
      if(i+1>=lines.length){ e.preventDefault(); return; }
      e.preventDefault(); mergeNext(i); return;
    }
    return;                                           // 行の中なら通常の1文字削除
  }
  if(e.key==='Backspace'&&!composing){
    const i=curLineIndex(); if(i<0) return;
    const sel=getSelection();
    if(!sel.isCollapsed) return;
    const off=caretOffsetIn(ED.children[i]);
    // 装飾の右端では、まず装飾だけを外す
    if(off>0&&MODE()!=='marks'){
      const r=sel.getRangeAt(0);
      let n=r.startContainer; while(n&&n.parentNode!==ED.children[i]) n=n.parentNode;
      if(n&&n.dataset&&n.dataset.k&&n.dataset.k!=='cs'&&off===offsetOfEnd(ED.children[i],n)){
        e.preventDefault(); unwrapEffect(i,n); return;
      }
    }
    if(off===0&&i>0){ e.preventDefault(); mergeLine(i); }
  }
});
function offsetOfEnd(line,node){
  let acc=0;
  for(const n of line.childNodes){ acc+=n.textContent.length; if(n===node) return acc; }
  return -1;
}
ED.addEventListener('keyup',markCurrent);
ED.addEventListener('click',markCurrent);

function splitLine(){
  const i=curLineIndex(); if(i<0) return;
  pushUndo(true);
  const off=caretOffsetIn(ED.children[i])||0;
  const wasBold=(lineType(lines[i])==='thread'||lineType(lines[i])==='img');
  const [a,b]=splitRaw(lines[i],off,MODE(),S.cfg.assist.keepBold);
  lines.splice(i,1,a,b);
  renderAll(); afterEdit(); runCheck(); renderOutline();
  // 下の行が空でも、太字のまま書き始められるようにする
  // （記号は文字を打った時点で付く）
  if(wasBold&&S.cfg.assist.keepBold&&lines[i+1]===''){
    const d=ED.children[i+1];
    if(d){ d.classList.remove('t-blank'); d.classList.add('t-thread'); }
  }
  focusLine(i+1,0);
}
/** 行末のDeleteで次の行を引き上げる。カーソルは継ぎ目に残す。 */
function mergeNext(i){
  pushUndo(true);
  const off=shown(lines[i]).length;
  lines.splice(i,2,joinRaw(lines[i],lines[i+1]));
  renderAll(); afterEdit(); runCheck(); renderOutline();
  focusLine(i,off);
}
function mergeLine(i){
  pushUndo(true);
  const off=shown(lines[i-1]).length;
  lines.splice(i-1,2,joinRaw(lines[i-1],lines[i]));
  renderAll(); afterEdit(); runCheck(); renderOutline();
  focusLine(i-1,off);
}
function moveLine(d){
  const rg=selectedRange(); if(!rg) return;
  const [a,b]=rg;
  if(d<0&&a===0) return;
  if(d>0&&b===lines.length-1) return;
  pushUndo(true);
  const seg=lines.splice(a,b-a+1);
  lines.splice(a+d,0,...seg);
  renderAll(); afterEdit(); runCheck(); renderOutline();
  focusLine(a+d,0);
}
function selectAll(){
  const r=document.createRange(); r.selectNodeContents(ED);
  const s=getSelection(); s.removeAllRanges(); s.addRange(r); ED.focus();
}
function selectedRange(){
  const sel=getSelection(); if(!sel.rangeCount) return null;
  const r=sel.getRangeAt(0);
  const idx=n=>{ if(n===ED) return null; while(n&&n.parentNode!==ED) n=n.parentNode; return n?[...ED.children].indexOf(n):-1; };
  let a=idx(r.startContainer), b=idx(r.endContainer);
  if(a===null) a=0;
  if(b===null) b=lines.length-1;
  if(a<0||b<0) return null;
  return [Math.min(a,b),Math.max(a,b)];
}

/* ---- 太字と効果 ---- */
function toggleBold(){
  const rg=selectedRange(); if(!rg) return;
  const [a,b]=rg;
  const sel=getSelection();
  const collapsed=sel.isCollapsed;
  const off=collapsed?caretOffsetIn(ED.children[a]):null;

  // 文字の無い行だけを選んでいる場合は「これから太字で書く」状態にする
  const allEmpty=(()=>{ for(let i=a;i<=b;i++) if(lines[i].trim()!=='') return false; return true; })();
  if(allEmpty){
    const d=ED.children[a]; if(!d) return;
    const on=!d.classList.contains('t-thread');
    for(let i=a;i<=b;i++){
      const x=ED.children[i]; if(!x) continue;
      x.classList.toggle('t-thread',on);
      x.classList.toggle('t-blank',!on);
    }
    updateBoldState();
    toast(on?'ここから太字で書けます':'通常に戻しました');
    return;
  }

  pushUndo(true);
  let anyPlain=false;
  for(let i=a;i<=b;i++) if(lines[i].trim()&&!lines[i].trim().startsWith('**')) anyPlain=true;
  for(let i=a;i<=b;i++){
    const t=lines[i]; if(!t.trim()) continue;
    lines[i]=anyPlain?(t.trim().startsWith('**')?t:'**'+t.trim()+'**'):unbold(t);
  }
  renderAll(); afterEdit(); runCheck();
  // カーソルだけの場合はその位置に戻す（続けて書けるように）
  if(collapsed) focusLine(a,Math.min(off||0,shown(lines[a]).length));
  else focusLine(b,shown(lines[b]).length);
}
function wrapEffect(mk){
  const sel=getSelection(); if(!sel.rangeCount) return;
  const i=curLineIndex(); if(i<0) return;
  const r=sel.getRangeAt(0);
  const d=ED.children[i];
  const s0=caretOffsetIn(d);
  const pre=r.cloneRange(); pre.selectNodeContents(d); pre.setEnd(r.endContainer,r.endOffset);
  const s1=pre.toString().length;
  if(s0===s1){ toast('効果をつける範囲を選んでください'); return; }
  pushUndo(true);
  const p=partsOf(lines[i]);
  if(MODE()==='marks'){
    const a=innerOffset(p.inner,Math.min(s0,s1),MODE()), b=innerOffset(p.inner,Math.max(s0,s1),MODE());
    lines[i]=buildRaw(p.bold,p.inner.slice(0,a)+mk+p.inner.slice(a,b)+mk+p.inner.slice(b));
  }else{
    const ch=parseInner(p.inner);
    for(let k=Math.min(s0,s1);k<Math.max(s0,s1)&&k<ch.length;k++){
      ch[k].fx=(mk==='@@'?'at':'pp'); ch[k].fg=null; ch[k].bg=null;
    }
    lines[i]=buildRaw(p.bold,serializeInner(ch));
  }
  redrawLine(i,Math.max(s0,s1)); updateGutter(); afterEdit(); runCheck();
}
function unwrapEffect(i,node){
  pushUndo(true);
  const txt=node.textContent, k=node.dataset.k, mk=MK[k];
  lines[i]=lines[i].replace(mk+txt+mk,txt);
  redrawLine(i); updateGutter(); afterEdit(); runCheck();
}
function toggleMode(){
  const i=curLineIndex(), off=i>=0?caretOffsetIn(ED.children[i]):0;
  ST().mode=MODE()==='marks'?'plain':'marks';
  save();
  $('#b-mode').textContent=MODE()==='marks'?'記号を隠す':'記号を表示';
  $('#b-mode').classList.toggle('on',MODE()==='marks');
  renderAll(); renderRef();
  if(i>=0) focusLine(i,Math.min(off||0,ED.children[i].textContent.length));
  toast(MODE()==='marks'?'記号を表示しています':'ドキュメントと同じ見た目にしました');
}

/* ---- 貼り付け ---- */
ED.addEventListener('paste',e=>{
  e.preventDefault();
  const html=e.clipboardData.getData('text/html');
  const txt=e.clipboardData.getData('text/plain');
  // 書式なしの貼り付け（Ctrl+Shift+V など）：書式の情報が来ない。
  // 記号つきの文（PC版・スマホ版から「記号つき」で渡したもの）でなければ、貼り先の書式に合わせる。
  if(!html&&!hasMarks(txt)){ insertPlain(txt); return; }
  // アプリ内で切り取り・コピーしたものなら、その書式のまま貼る
  if(lastClip&&norm1(txt)===norm1(lastClip.plain)){
    insertText(lastClip.raw.join('\n'),{keepFormat:true});
    return;
  }
  insertText(pickPaste(html,txt),{keepFormat:true});
});
const norm1=s=>String(s||'').replace(/\r\n?/g,'\n').replace(/\s+$/,'');
/** 記号（** @@ ++ {{ }}）を含む文か */
const hasMarks=s=>/\*\*|@@|\+\+|\{\{(?:fg|bg)=#/.test(String(s||''));
/** 書式なしで貼る：文字だけを、貼り先の行の書式のまま差し込む。
 *  1行なら行を割らずにそのまま入る。複数行なら、各行が貼り先と同じ書式になる。 */
function insertPlain(text){
  const i=curLineIndex();
  const parts=String(text||'').replace(/\r\n?/g,'\n').split('\n').map(p=>strip(p));
  if(!parts.length||(parts.length===1&&parts[0]==='')) return;
  pushUndo(true);
  if(i<0){ lines=lines.concat(parts); renderAll(); afterEdit(); runCheck(); renderOutline(); return; }
  const destBold=(lineType(lines[i])==='thread'||lineType(lines[i])==='img'
    ||(ED.children[i]&&ED.children[i].classList.contains('t-thread')&&lines[i]===''));
  const off=caretOffsetIn(ED.children[i])||0;
  if(parts.length===1){
    // 行の途中にそのまま入れる。空の太字行なら太字のまま
    const base=(lines[i]===''&&destBold)?'****':lines[i];
    lines[i]=insertIntoRaw(base,off,parts[0],MODE());
    if(destBold&&!/^\s*\*\*/.test(lines[i])) lines[i]='**'+lines[i]+'**';
    renderAll(); afterEdit(); runCheck(); renderOutline();
    focusLine(i,off+parts[0].length);
    return;
  }
  const wrap=p=>(destBold&&p!=='')?'**'+p+'**':p;
  const [h,t]=splitRaw(lines[i],off,MODE(),true);
  const ph=partsOf(h), pt=partsOf(t);
  const first=buildRaw(ph.bold||destBold, serializeInner(parseInner(ph.inner+parts[0])));
  const lastText=parts[parts.length-1];
  const lastLine=buildRaw(pt.bold||destBold, serializeInner(parseInner(lastText+pt.inner)));
  lines.splice(i,1,first,...parts.slice(1,-1).map(wrap),lastLine);
  renderAll(); afterEdit(); runCheck(); renderOutline();
  const at=i+parts.length-1;
  focusLine(at,lastText.length);
}
/** ［書式なしで貼り付け］ボタン用 */
async function pastePlain(){
  try{
    const t=await navigator.clipboard.readText();
    if(!t){ toast('クリップボードが空です'); return; }
    if(hasMarks(t)) insertText(t,{keepFormat:true}); else insertPlain(t);
  }catch(e){ toast('貼り付けできません。エディタの上で Ctrl+Shift+V を使ってください'); }
}
/** 貼り付け元を選ぶ。
 *  記号つきのテキスト（アプリから出したもの）はそのまま。
 *  それ以外で書式があれば、書式から記号を組み立て直す。 */
function pickPaste(html,txt){
  txt=String(txt||'');
  if(/\*\*/.test(txt)) return txt;                       // アプリ由来
  if(!html) return txt;
  if(!/<(b|strong|span|p|div|li|br|h[1-6]|table)\b/i.test(html)) return txt;
  try{
    const rich=htmlToScript(html).split('\n');
    // 改行の位置は素のテキストを正とする（空行が最も確実に残る）
    const merged=txt?mergeWithPlain(rich,txt):null;
    const r=(merged||rich).join('\n');
    // 書式から作った結果が明らかに短ければ、素のテキストを使う
    const a=r.replace(/[*@+\s]/g,'').length, b=txt.replace(/\s/g,'').length;
    return (b>0&&a<b*0.8)?txt:r;
  }catch(e){ return txt; }
}
function insertText(text,opt){
  opt=opt||{};
  const i0=curLineIndex();
  let parts0=String(text).replace(/\r\n?/g,'\n').split('\n');
  // 貼る側の書式を守る：書式の違う1行を行の途中に貼るときは、その行だけ独立させる
  if(opt.keepFormat&&i0>=0&&parts0.length===1&&parts0[0]!==''){
    const destBold=(lineType(lines[i0])==='thread'||lineType(lines[i0])==='img'
      ||(ED.children[i0]&&ED.children[i0].classList.contains('t-thread')&&lines[i0]===''));
    const srcBold=/^\s*\*\*[\s\S]*\*\*\s*$/.test(parts0[0]);
    if(lines[i0]===''){
      pushUndo(true);
      lines[i0]=parts0[0];
      renderAll(); afterEdit(); runCheck(); renderOutline();
      focusLine(i0,shown(lines[i0]).length);
      return;
    }
    if(destBold!==srcBold){
      pushUndo(true);
      const off=caretOffsetIn(ED.children[i0])||0;
      const [h,t]=splitRaw(lines[i0],off,MODE(),true);
      const seg=[];
      if(partsOf(h).inner!=='') seg.push(h);
      seg.push(parts0[0]);
      if(partsOf(t).inner!=='') seg.push(t);
      lines.splice(i0,1,...seg);
      renderAll(); afterEdit(); runCheck(); renderOutline();
      const at=i0+(partsOf(h).inner!==''?1:0);
      focusLine(at,shown(lines[at]).length);
      toast('書式が違うため別の行として貼りました');
      return;
    }
  }
  const i=i0;
  let parts=parts0;
  // すでに太字の行へ太字の内容を貼るときは、重なる ** を外す
  const intoBold=i>=0&&(lineType(lines[i])==='thread'||lineType(lines[i])==='img'
    ||(ED.children[i]&&ED.children[i].classList.contains('t-thread')));
  if(intoBold&&parts.some(p=>/^\s*\*\*[\s\S]*\*\*\s*$/.test(p))){
    parts=parts.map(p=>/^\s*\*\*[\s\S]*\*\*\s*$/.test(p)?unbold(p):p);
  }
  pushUndo(true);
  if(i<0){ lines=lines.concat(parts); }
  else{
    const off=caretOffsetIn(ED.children[i])||0;
    if(parts.length===1) lines[i]=insertIntoRaw(lines[i],off,parts[0],MODE());
    else{
      const [h,t2]=splitRaw(lines[i],off,MODE(),S.cfg.assist.keepBold);
      lines.splice(i,1,joinRaw(h,parts[0]),...parts.slice(1,-1),joinRaw(parts[parts.length-1],t2));
    }
  }
  renderAll(); afterEdit(); runCheck(); renderOutline();
  const at=i<0?lines.length-1:i+parts.length-1;
  focusLine(at,shown(lines[at]||'').length);
}

  ['#dd7e6b','#ea9999','#f9cb9c','#ffe599','#b6d7a8','#a2c4c9','#a4c2f4','#9fc5e8','#b4a7d6','#d5a6bd'],
  ['#cc4125','#e06666','#f6b26b','#ffd966','#93c47d','#76a5af','#6d9eeb','#6fa8dc','#8e7cc3','#c27ba0'],

let colorSel=null;          // 色見本を開いたときの選択範囲（見本を触ると選択が消えるため控える）

/** 選択範囲の文字色（kind='fg'）か背景色（kind='bg'）を変える。color が null なら外す。 */
function applyColor(kind,color){
  return applyColors(kind==='fg'?{fg:color}:{bg:color});
}
/** 文字色と背景色をまとめて変える（1回の取り消しで戻る）。
 *  change は {fg:色|null} / {bg:色|null} / 両方 */
function applyColors(change){
  if(MODE()==='marks'){ toast('色は記号を隠した表示で変えられます（Ctrl+E で切り替え）'); return false; }
  const sr=colorSel||selectedRaw();
  if(!sr||(sr.a===sr.b&&sr.s0===sr.s1)){ toast('色を変える文字を選んでください'); return false; }
  pushUndo(true);
  for(let i=sr.a;i<=sr.b;i++){
    const p=partsOf(lines[i]);
    const ch=parseInner(p.inner);
    const from=i===sr.a?sr.s0:0, to=i===sr.b?sr.s1:ch.length;
    for(let k=from;k<to&&k<ch.length;k++){
      const c=ch[k];
      // @@ ++ の文字を塗り直すときは、いまの見た目の色を引き継いでから変える
      if(c.fx==='at'){ c.bg=FX.atBg; c.fx=null; }
      else if(c.fx==='pp'){ c.bg=FX.ppBg; c.fg=FX.ppFg; c.fx=null; }
      if('fg' in change) c.fg=change.fg||null;
      if('bg' in change) c.bg=change.bg||null;
    }
    lines[i]=buildRaw(p.bold,serializeInner(ch));
  }
  renderAll(); afterEdit(); runCheck();
  selectDisp(sr.a,sr.s0,sr.b,sr.s1);
  if(change.fg){ S.cfg.lastFg=change.fg; }
  if(change.bg){ S.cfg.lastBg=change.bg; }
  if(change.fg||change.bg){ save(); paintSwatches(); }
  return true;
}
/** 表示上の位置で範囲を選び直す */
function selectDisp(a,s0,b,s1){
  const pos=(li,off)=>{
    const d=ED.children[li]; if(!d) return null;
    const walk=document.createTreeWalker(d,NodeFilter.SHOW_TEXT);
    let n,acc=0;
    while((n=walk.nextNode())){ const L=n.nodeValue.length; if(acc+L>=off) return [n,off-acc]; acc+=L; }
    return [d,d.childNodes.length];
  };
  const p0=pos(a,s0), p1=pos(b,s1); if(!p0||!p1) return;
  if(document.activeElement!==ED) ED.focus();   // 先に焦点を当ててから選ぶ（逆だと選択が消える）
  const r=document.createRange();
  try{ r.setStart(p0[0],p0[1]); r.setEnd(p1[0],p1[1]); }catch(e){ return; }
  const s=getSelection(); s.removeAllRanges(); s.addRange(r);
}

/* ================== レス番号 ================== */
function lastNumBefore(i){
  let found=null;
  for(let k=i;k>=0;k--){
    const m=strip(lines[k]||'').trim().match(RE_NUMLINE);
    if(m){ found={n:+m[1],i:k,meta:metaOf(lines[k])}; break; }
  }
  if(!found) return null;
  // 日付は「最後に日付が書かれた行」と比べる
  if(!found.meta.date){
    for(let k=found.i;k>=0;k--){
      const mm=metaOf(lines[k]||'');
      if(mm.date){ found.dateMeta=mm; break; }
    }
  }else found.dateMeta=found.meta;
  return found;
}
async function insertNumber(withTime){
  const i=curLineIndex(); if(i<0) return;
  const prev=lastNumBefore(i);
  let meta={date:null,elapsedH:null},deco='';
  if(withTime){
    const r=await askTime(); if(!r) return;
    deco='　'+r.deco; meta=metaOf(r.deco);
  }
  let next;
  if(!prev) next=1;
  else if(prev.n<8&&gapRange((meta.date&&prev.dateMeta)?prev.dateMeta:prev.meta,meta,S.cfg).why==='通常') next=prev.n+1;
  else{
    const basis=(meta.date&&prev.dateMeta)?prev.dateMeta:prev.meta;
    const gr=gapRange(basis,meta,S.cfg);
    next=prev.n+(gr.why==='通常'?pickWeighted(gr.range,S.cfg.gapWeights):pick(gr.range));
  }
  // 直後にある番号を超えないようにする
  let nextAfter=null;
  for(let k=i+1;k<lines.length;k++){
    const m=strip(lines[k]||'').trim().match(RE_NUMLINE);
    if(m){ nextAfter=+m[1]; break; }
  }
  if(nextAfter!==null&&prev){
    if(nextAfter-prev.n<2){
      await dialog('番号を入れる余地がありません',
        el('p',null,'直前が '+prev.n+' 番、直後が '+nextAfter+' 番です。'+
          'この間に入れられる番号がありません。先に後ろの番号を振り直してください。'),
        [{t:'閉じる',v:null}]);
      return;
    }
    if(next>=nextAfter){
      // 間に収まる値へ寄せる
      next=prev.n+1+Math.floor(Math.random()*(nextAfter-prev.n-1));
      toast('直後の '+nextAfter+' 番に収まるよう '+next+' 番にしました');
    }
  }
  if(next>1000){
    await dialog('レス番号が1000を超えます',
      el('p',null,'直前は '+prev.n+' 番、次は '+next+' 番になります。'+
        'スレは1000番で書き込めなくなるため、ここで新しいスレに移ってください。'),
      [{t:'閉じる',v:null}]);
    return;
  }
  pushUndo(true);
  const who=(!prev)?'イッチ':'名無し';
  const at=(lines[i].trim()==='')?i:i+1;
  const head='**'+next+'.'+who+deco+'**';
  const add=[head];
  if(S.cfg.assist.emptyLine) add.push('****');   // 空の太字行（設定で入）
  add.push('');                                   // 投稿のあとの空行
  lines.splice(at,0,...add);
  renderAll(); afterEdit(); runCheck(); renderOutline();
  // 番号行の末尾にカーソルを置く。改行すれば太字のまま本文を書ける。
  const cur=S.cfg.assist.emptyLine?at+1:at;
  focusLine(cur,shown(lines[cur]).length);
  if(S.cfg.assist.emptyLine&&ED.children[cur]){
    ED.children[cur].classList.remove('t-blank');
    ED.children[cur].classList.add('t-thread');
  }
  if(next>=880) toast(next+'番です。1000番が近づいています');
}
function askTime(){
  const box=el('div');
  box.innerHTML='<div class="kv">'+
    '<label>種類</label><select id="tk"><option value="date">日付（@@ 日をまたぐ）</option>'+
    '<option value="elapse">経過（++ 同日内）</option></select>'+
    '<label>日付</label><input type="text" id="td" placeholder="2024/4/6(土)　12時～">'+
    '<label>経過</label><input type="text" id="te" placeholder="※2時間後の時間にしてください">'+
    '</div>';
  return dialog('日時・経過を入れる',box,[{t:'取消',v:null},{t:'入れる',v:'ok',primary:true}]).then(v=>{
    if(v!=='ok') return null;
    if(box.querySelector('#tk').value==='date'){
      const d=box.querySelector('#td').value.trim(); return d?{deco:'@@'+d+'@@'}:null;
    }
    const e2=box.querySelector('#te').value.trim(); return e2?{deco:'++'+e2+'++'}:null;
  });
}
async function doRenumber(){
  const rg=selectedRange();
  const whole=!rg||rg[0]===rg[1];
  let r;
  if(whole){ r=renumberRange(lines,S.cfg); }
  else{ r=renumberRange(lines,S.cfg,rg[0],rg[1]); }
  if(!r.ok){
    if(r.reason==='tight'){
      await dialog('範囲に収まりません',
        el('p',null,'直前が '+r.lo+' 番、直後が '+r.hi+' 番で、その間に '+r.need+
          ' 件を入れる必要があります。間隔が足りないため振り直せません。範囲を広げてください。'),
        [{t:'閉じる',v:null}]);
    }else if(r.reason==='over'){
      await dialog('レス番号が1000を超えます',
        el('p',null,'このまま積むと '+r.overflow.next+' 番になります。新しいスレに移ってください。'),
        [{t:'閉じる',v:null}]);
    }else toast('振り直せる番号がありません');
    return;
  }
  const changed=r.plan.filter(p=>p.from!==p.to);
  if(!changed.length){ toast('変更はありません'); return; }
  const box=el('div');
  const t=el('table','diff');
  t.innerHTML='<tr><th>行</th><th>変更前</th><th>変更後</th><th></th></tr>'+
    changed.slice(0,400).map(p=>'<tr><td>'+(p.i+1)+'</td><td>'+p.from+'</td><td><b>'+p.to+'</b></td><td>'+p.who+'</td></tr>').join('');
  const ns=r.plan.map(p=>p.to);
  box.append(el('p',null,(whole?'全体':'選んだ範囲（'+(rg[0]+1)+'〜'+(rg[1]+1)+'行）')+
    'で '+changed.length+'件の番号が変わります。'+
    (whole?'':'範囲内は '+Math.min(...ns)+'〜'+Math.max(...ns)+' に収まり、範囲外の番号は動きません。')+
    'アンカー（>>）も追従します。'),t);
  if(await dialog('番号の振り直し',box,[{t:'取消',v:null},{t:'適用する',v:'ok',primary:true}])!=='ok') return;
  pushUndo(true);
  lines=r.lines; renderAll(); afterEdit(); runCheck(); renderOutline();
  toast(changed.length+'件を振り直しました（Ctrl+Zで戻せます）');
}

/* ================== チェック ================== */
let checkT=null, chkFilter='all', lastSig=null;
function scheduleCheck(){ clearTimeout(checkT); checkT=setTimeout(runCheck,220); }
const hitKey=h=>h.kind+'\u0000'+(lines[h.i]||'')+'\u0000'+h.msg.replace(/\d+/g,'#');
function runCheck(){
  if(paused||!ST().check){ hits=[]; hitByLine=new Map(); paintHits(); lastSig=null; renderHits(); updateStatus(); return; }
  hits=check(lines,S.cfg);
  const exc=new Set(ST().exc||[]), done=new Set(ST().done||[]);
  hits.forEach(h=>{ const k=hitKey(h); h.key=k; h.st=exc.has(k)?'exc':(done.has(k)?'done':'open'); });
  hitByLine=new Map();
  hits.forEach(h=>{ if(h.st==='open'&&!hitByLine.has(h.i)) hitByLine.set(h.i,h); });
  paintHits();
  // 指摘の中身が変わっていなければ一覧は組み直さない（打鍵のたびの作り直しを避ける）
  const sig=hits.map(h=>h.i+':'+h.kind+':'+h.st).join('|')+'|'+chkFilter+'|'+paused;
  if(sig!==lastSig){ lastSig=sig; renderHits(); }
  updateStatus();
}
function applyHit(d,i){
  const h=hitByLine.get(i);
  if(h){ d.classList.add('bad'); d.style.setProperty('--c',S.cfg.colors[h.kind]||'var('+KIND[h.kind].color+')'); }
  else{ d.classList.remove('bad'); d.style.removeProperty('--c'); }
}
let lastBad=new Set();
function paintHits(){
  const now=new Set(hitByLine.keys());
  const kids=ED.children;
  lastBad.forEach(i=>{ if(!now.has(i)&&kids[i]){ kids[i].classList.remove('bad'); kids[i].style.removeProperty('--c'); } });
  now.forEach(i=>{ if(kids[i]) applyHit(kids[i],i); });
  lastBad=now;
}
function kindColor(k){ return S.cfg.colors[k]||getComputedStyle(document.documentElement).getPropertyValue(KIND[k].color); }
function renderHits(){
  const box=$('#sb-chk'); box.textContent='';
  const row=el('div','row');
  const pz=el('button','btn mini',paused?'停止中':'一時停止');
  pz.onclick=()=>{paused=!paused;runCheck();renderHits()};
  const cl=el('button','btn mini','解決済みを戻す');
  cl.onclick=()=>{ST().done=[];save();runCheck()};
  const fz=el('button','btn mini','まとめて伏字に');
  fz.onclick=fixFusejiAll;
  row.append(pz,cl,fz); box.append(row);
  if(paused){ box.append(el('div','empty','チェックを止めています。上のボタンで再開します。')); return; }
  if(!ST().check){ box.append(el('div','empty','この工程はリアルタイムでチェックしていません。上の「リアルタイムでチェックする」で切り替えられます。')); return; }
  if(!hits.length){ box.append(el('div','empty','指摘はありません。')); return; }

  const open={},done=[],exc=[];
  hits.forEach(h=>{
    if(h.st==='exc') exc.push(h);
    else if(h.st==='done') done.push(h);
    else (open[h.kind]=open[h.kind]||[]).push(h);
  });
  // ジャンルの選び分け
  const pick=el('div','row');
  const mkChip=(id,label,color,n)=>{
    const on=chkFilter==='all'||chkFilter===id;
    const b=el('button','btn mini'+(chkFilter===id?' on':''));
    b.textContent=label+' '+n;
    if(color&&chkFilter!==id){ b.style.borderLeft='4px solid '+color; }
    b.style.opacity=on?'1':'.5';
    b.onclick=()=>{ chkFilter=(chkFilter===id)?'all':id; lastSig=null; renderHits(); };
    return b;
  };
  const total=hits.filter(h=>h.st==='open').length;
  const allb=el('button','btn mini'+(chkFilter==='all'?' on':''));
  allb.textContent='すべて '+total;
  allb.onclick=()=>{ chkFilter='all'; lastSig=null; renderHits(); };
  pick.append(allb);
  KIND_ORDER.forEach(k=>{ if(open[k]) pick.append(mkChip(k,KIND[k].label,kindColor(k),open[k].length)); });
  if(done.length) pick.append(mkChip('done','解決済み','#8a9199',done.length));
  if(exc.length)  pick.append(mkChip('exc','例外','#8a9199',exc.length));
  box.append(pick);

  const show=id=>chkFilter==='all'||chkFilter===id;
  let shown=0;
  KIND_ORDER.forEach(k=>{
    if(!open[k]||!show(k)) return;
    shown+=open[k].length;
    box.append(group(KIND[k].label,kindColor(k),open[k],true));
  });
  if(done.length&&show('done')){ shown+=done.length; box.append(group('解決済み','#8a9199',done,chkFilter==='done')); }
  if(exc.length&&show('exc')){ shown+=exc.length; box.append(group('例外','#8a9199',exc,chkFilter==='exc')); }
  if(!shown) box.append(el('div','empty','この種類の指摘はありません。'));
}
function group(label,color,arr,openDefault){
  const d=el('details','grp'); d.open=openDefault;
  const s=el('summary');
  const sw=el('span','sw'); sw.style.background=color;
  s.append(sw,el('span',null,label),el('span','n',String(arr.length)));
  d.append(s);
  const CAP=150;
  arr.slice(0,CAP).forEach(h=>d.append(hitRow(h)));
  if(arr.length>CAP){
    const more=el('button','hit');
    const g=el('button','go','… 残り'+(arr.length-CAP)+'件を出す');
    g.onclick=()=>{ more.remove(); arr.slice(CAP).forEach(h=>d.append(hitRow(h))); };
    more.append(g); d.append(more);
  }
  return d;
}
function hitRow(h){
  const r=el('div','hit'+(h.st==='done'?' done':''));
  const cb=el('input'); cb.type='checkbox'; cb.checked=h.st==='done'; cb.title='解決済みにする';
  cb.onchange=()=>{
    ST().done=(ST().done||[]).filter(x=>x!==h.key);
    if(cb.checked) ST().done.push(h.key);
    save(); runCheck();
  };
  const go=el('button','go');
  go.append(el('span','ln-no',String(h.i+1)),document.createTextNode(h.msg));
  const head=snip(shown(lines[h.i]||''),30);
  if(head) go.append(el('span','head',head));
  go.onclick=()=>focusLine(h.i,0);
  if(h.kind==='fuseji'&&/伏字漏れ/.test(h.msg)){
    const fx=el('button','ex','伏字に');
    fx.title='この行を伏字にする';
    fx.onclick=()=>fixFuseji(h.i);
    r.append(fx);
  }
  const ex=el('button','ex',h.st==='exc'?'戻す':'例外');
  ex.onclick=()=>{
    ST().exc=(ST().exc||[]).filter(x=>x!==h.key);
    if(h.st!=='exc') ST().exc.push(h.key);

  r.append(cb,go,ex); return r;
}
/** 指摘の出た行を伏字にする */
function fixFuseji(i){
  const isBody=lineType(lines[i])==='body';
  const p=partsOf(lines[i]);
  const fixed=applyFuseji(p.inner,isBody);
  if(fixed===p.inner){ toast('伏せる箇所が見つかりません'); return; }
  pushUndo(true);
  lines[i]=buildRaw(p.bold,fixed);
  renderAll(); afterEdit(); runCheck(); renderOutline();
  focusLine(i,0);
  toast('伏字にしました');
}
/** 指摘の出ている行をまとめて伏字にする */
async function fixFusejiAll(){
  const targets=[...new Set(hits.filter(h=>h.st==='open'&&h.kind==='fuseji'&&/伏字漏れ/.test(h.msg)).map(h=>h.i))];
  if(!targets.length){ toast('伏字漏れの指摘はありません'); return; }
  const box=el('div');

      snip(applyFuseji(p.inner,lineType(lines[i])==='body'),26)+'</td></tr>';
  }).join('');
  box.append(t);
  if(await dialog('まとめて伏字にする',box,[{t:'取消',v:null},{t:'実行',v:'ok',primary:true}])!=='ok') return;
  pushUndo(true);
  let n=0;
  targets.forEach(i=>{
    const p=partsOf(lines[i]);
    const f=applyFuseji(p.inner,lineType(lines[i])==='body');
    if(f!==p.inner){ lines[i]=buildRaw(p.bold,f); n++; }
  });
  renderAll(); afterEdit(); runCheck(); renderOutline();
  toast(n+'行を伏字にしました（Ctrl+Zで戻せます）');
}
function jumpNextHit(){
  const open=hits.filter(h=>h.st==='open'); if(!open.length) return;
  const i=curLineIndex();
  focusLine((open.find(h=>h.i>i)||open[0]).i,0);
}

/* ================== 目印 ================== */
const MARK_COLORS=['--mark1','--mark2','--mark3','--mark4','--mark5','--mark6'];
const cvar=v=>getComputedStyle(document.documentElement).getPropertyValue(v);
function markKey(i){
  const t=lines[i]||''; let nth=0;
  for(let k=0;k<i;k++) if(lines[k]===t) nth++;
  return {text:t,nth};
}
function findMark(i){
  const k=markKey(i);
  return (ST().marks||[]).find(m=>m.text===k.text&&m.nth===k.nth);
}
let markIdxCache=null, markIdxKey='';
function markLineIndex(m){
  const key=lines.length+'\u0000'+(ST().marks||[]).length;
  if(markIdxCache&&markIdxKey===key&&markIdxCache.has(m)) return markIdxCache.get(m);
  if(!markIdxCache||markIdxKey!==key){ markIdxCache=new Map(); markIdxKey=key; }
  let nth=0;
  for(let i=0;i<lines.length;i++){ if(lines[i]===m.text){ if(nth===m.nth){ markIdxCache.set(m,i); return i; } nth++; } }
  markIdxCache.set(m,-1); return -1;
}
function clearMarkCache(){ markIdxCache=null; }
async function toggleMark(){
  const i=curLineIndex(); if(i<0) return;
  ST().marks=ST().marks||[];
  const ex=findMark(i);
  if(ex){
    ST().marks=ST().marks.filter(m=>m!==ex);
    save(); paintMarks(); renderMarks(); renderStages(); return;
  }
  const m=Object.assign(markKey(i),{c:S.cfg.markColor,note:''});
  ST().marks.push(m);
  save(); paintMarks(); renderMarks(); renderStages();
  if(!S.cfg.askNote) return;
  const box=el('div');
  const ta=el('textarea'); ta.placeholder='メモ（空のままでも構いません）';
  const chk=el('label');
  const cb=el('input'); cb.type='checkbox';
  chk.append(cb,document.createTextNode(' 今後は聞かない'));
  box.append(el('p','note',snip(shown(lines[i]||''),34)||'（空行）'),ta,chk);
  const v=await dialog('目印にメモを入れますか',box,[{t:'入れない',v:'no'},{t:'保存',v:'ok',primary:true}]);
  if(cb.checked){ S.cfg.askNote=false; }
  if(v==='ok'&&ta.value.trim()) m.note=ta.value.trim();
  save(); renderMarks();
}
function applyMark(d,i){
  const m=findMark(i);
  if(m){ d.dataset.mark='1'; d.style.setProperty('--mc',cvar(MARK_COLORS[(m.c||1)-1])); }
  else{ delete d.dataset.mark; d.style.removeProperty('--mc'); }
}
let lastMark=new Set();
function paintMarks(){
  const idx=new Set();
  (ST().marks||[]).forEach(m=>{ const i=markLineIndex(m); if(i>=0) idx.add(i); });
  const kids=ED.children;
  lastMark.forEach(i=>{ if(!idx.has(i)&&kids[i]){ delete kids[i].dataset.mark; kids[i].style.removeProperty('--mc'); } });
  idx.forEach(i=>{ if(kids[i]) applyMark(kids[i],i); });
  lastMark=idx;
}
let markFilter=0;
function renderMarks(){
  const box=$('#sb-mark'); box.textContent='';
  const bar=el('div','row');
  MARK_COLORS.forEach((c,k)=>{
    const b=el('button','cdot'+(S.cfg.markColor===k+1?' on':''));
    b.style.background=cvar(c); b.title='この色で付ける';
    b.onclick=()=>{S.cfg.markColor=k+1;save();renderMarks()};
    bar.append(b);
  });
  const f=el('select');
  f.innerHTML='<option value="0">すべて</option>'+MARK_COLORS.map((c,k)=>'<option value="'+(k+1)+'">色'+(k+1)+'</option>').join('');
  f.value=String(markFilter); f.onchange=()=>{markFilter=+f.value;renderMarks()};
  const clr=el('button','btn mini','絞り込み中を消去');
  clr.onclick=async()=>{
    if(!await confirmBox('目印の消去',markFilter?'色'+markFilter+'の目印を消します。':'この工程の目印をすべて消します。','消す')) return;
    ST().marks=(ST().marks||[]).filter(m=>markFilter&&m.c!==markFilter);
    save(); paintMarks(); renderMarks(); renderStages();
  };
  bar.append(f,clr); box.append(bar);

  const ms=(ST().marks||[]).filter(m=>!markFilter||m.c===markFilter);
  if(!ms.length){ box.append(el('div','empty','目印はありません。行の上でショートカットを押すと付きます。')); return; }
  const lost=ms.filter(m=>markLineIndex(m)<0).length;
  if(lost) box.append(el('div','row','目印を付けた行が '+lost+' 件見つかりません（削除された可能性があります）'));
  ms.forEach(m=>{
    const i=markLineIndex(m);
    const row=el('div','mk-row'+(i<0?' lost':''));
    const dot=el('button','cdot'); dot.style.background=cvar(MARK_COLORS[(m.c||1)-1]); dot.title='色を変える';
    dot.onclick=()=>{m.c=(m.c%6)+1;save();paintMarks();renderMarks()};
    const go=el('button','go');
    go.append(el('span','ln-no',i<0?'—':String(i+1)),
      document.createTextNode(i<0?'（行が見つかりません）':(snip(shown(m.text),30)||'（空行）')));
    if(m.note) go.append(el('span','head',m.note));

    const nt=el('button','btn mini','メモ');
    nt.onclick=async()=>{

        m.note=inp.value.trim(); save(); renderMarks();
      }
    };
    const x=el('button','btn mini','×');
    x.onclick=()=>{ST().marks=ST().marks.filter(z=>z!==m);save();paintMarks();renderMarks();renderStages()};
    row.append(dot,go,nt,x); box.append(row);
  });
}
function jumpMark(dir){
  const ms=(ST().marks||[]).map(markLineIndex).filter(i=>i>=0).sort((a,b)=>a-b);
  if(!ms.length) return;
  const c=curLineIndex();
  const t=dir>0?(ms.find(i=>i>c)??ms[0]):([...ms].reverse().find(i=>i<c)??ms[ms.length-1]);
  focusLine(t,0);
}

/* ================== 見出し ================== */
let backStack=[];
function renderOutline(){

/* アンカー先へ移動（ショートカットから呼ぶ） */
function jumpAnchor(){
  const i=curLineIndex(); if(i<0) return;
  // カーソル行か、その投稿の中にある >>N を探す
  let m=null;
  for(let k=i;k>=Math.max(0,i-8);k--){
    m=strip(lines[k]||'').match(/>>(\d+)/);
    if(m) break;
    if(k<i&&lineType(lines[k])!=='thread') break;
  }
  if(!m){ toast('この行にアンカー（>>番号）がありません'); return; }
  const t=outline(lines).find(o=>o.kind==='num'&&o.num===+m[1]);
  if(!t){ toast('>>'+m[1]+' は本文にありません'); return; }
  backStack.push(i); focusLine(t.i,0);
  toast('>>'+m[1]+' へ移動しました（見出しの［← 戻る］で戻れます）');
}

/* ================== 読み上げ ================== */
/* ================== VOICEVOX ==================
 * 通信を行うのはこのクラスだけに閉じる。
 * 将来ローカルプロキシやElectronへ移すときは request() の中だけを差し替えればよい。 */
const VV_HOSTS=['http://127.0.0.1:50021','http://localhost:50021','http://[::1]:50021'];

class VoicevoxClient{
  constructor(){
    this.base=null;          // 実際に通じた接続先
    this.fixed=null;         // 明示指定された接続先
    this.version=null;
    this.speakers=[];
    this.log=[];             // 通信の記録（保存できる）
    this.lastError=null;
    this.hostResults=[];     // ホストごとの成否
  }
  setUrl(u){ this.fixed=(u||'').trim()||null; this.base=null; }
  /** 試す接続先の並び。明示指定が最優先。ポートは引き継ぐ。 */
  candidates(){
    if(this.fixed){
      let port='50021';
      try{ const u=new URL(this.fixed); if(u.port) port=u.port; }catch(e){}
      const rest=VV_HOSTS.map(h=>h.replace(/:\d+$/,':'+port)).filter(h=>h!==this.fixed);
      return [this.fixed,...rest];
    }
    return VV_HOSTS.slice();
  }
  async request(base,path,opt,timeout){
    const url=base+path;
    const t0=Date.now();
    const ac=new AbortController();
    const timer=setTimeout(()=>ac.abort(),timeout||20000);
    const rec={at:new Date().toISOString(),url,method:(opt&&opt.method)||'GET'};
    try{
      const res=await fetch(url,Object.assign({signal:ac.signal},opt||{}));
      rec.status=res.status; rec.ms=Date.now()-t0;
      this.log.push(rec);
      if(!res.ok){ const e=new Error('HTTP '+res.status); e.kind='http'; e.status=res.status; throw e; }
      return res;
    }catch(e){
      rec.ms=Date.now()-t0;
      rec.error=(e&&e.name)+': '+(e&&e.message);
      if(!rec.status) rec.kind=(e&&e.name==='AbortError')?'timeout':(e.kind||'network');
      this.log.push(rec);
      if(!e.kind) e.kind=(e&&e.name==='AbortError')?'timeout':'network';
      throw e;
    }finally{ clearTimeout(timer); }
  }
  /** 段階接続：まず /version だけを試し、通った接続先を覚える。 */
  async connect(){
    this.hostResults=[]; this.lastError=null;
    for(const base of this.candidates()){
      try{
        const res=await this.request(base,'/version',null,6000);
        this.version=(await res.text()).replace(/"/g,'').trim();
        this.base=base;
        this.hostResults.push({base,ok:true});
        await this.loadSpeakers();
        return {ok:true,base,version:this.version,speakers:this.speakers.length};
      }catch(e){
        this.hostResults.push({base,ok:false,kind:e.kind,message:e.message});
        this.lastError=e;
      }
    }
    return {ok:false,reason:this.diagnose()};
  }
  async loadSpeakers(){
    const res=await this.request(this.base,'/speakers',null,10000);
    const raw=await res.json();
    this.speakers=[];
    raw.forEach(sp=>(sp.styles||[]).forEach(st=>{
      this.speakers.push({id:st.id,name:sp.name+'（'+st.name+'）',uuid:sp.speaker_uuid});
    }));
  }
  async audioQuery(text,id){
    const res=await this.request(this.base,'/audio_query?text='+encodeURIComponent(text)+'&speaker='+id,
      {method:'POST'},20000);
    return res.json();
  }
  async synthesis(query,id){
    const res=await this.request(this.base,'/synthesis?speaker='+id,
      {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(query)},120000);
    return res.arrayBuffer();
  }
  /** 失敗の理由を推定する。断定はしない。 */
  diagnose(){
    const mac=/Mac/i.test(navigator.platform||navigator.userAgent||'');
    const file=location.protocol==='file:';
    const kinds=this.hostResults.map(h=>h.kind);
    if(kinds.every(k=>k==='network')){
      if(mac) return {cause:'ブラウザからEngineへ届いていません（推定）',
        detail:'VOICEVOX自体は起動している可能性があります。Macでは、ブラウザからローカルのEngineへアクセスする際にCORSやローカルアクセス制限で遮られることが知られています。'+
          (file?'いまはファイルを直接開いて実行しているため、その制限を受けやすい状態です。':''),
        how:['VOICEVOXが起動しているか確認する','VOICEVOXの設定でCORSの許可（マルチエンジン／実験的機能）を確認する','それでも通らない場合はブラウザ内蔵の音声を使う']};
      return {cause:'Engineに接続できません（推定）',
        detail:'指定した接続先のどれにも届きませんでした。VOICEVOXが起動していないか、ポートが違う可能性があります。',
        how:['VOICEVOXを起動する','設定の接続先が http://127.0.0.1:50021 になっているか確認する','ポートを変えている場合はその番号に合わせる']};
    }
    if(kinds.includes('timeout')) return {cause:'応答がありません（推定）',
      detail:'接続はできましたが、時間内に応答が返りませんでした。',how:['VOICEVOXの画面が固まっていないか確認する','起動し直す']};
    const http=this.hostResults.find(h=>h.kind==='http');
    if(http) return {cause:'Engineがエラーを返しました（推定）',detail:http.message,how:['VOICEVOXの版を確認する']};
    return {cause:'原因を特定できませんでした',detail:'',how:['通信ログを保存して確認する']};
  }
  logText(){
    const L=['台本スタジオ VOICEVOX 通信ログ','日時: '+new Date().toLocaleString('ja-JP'),
      'Platform: '+(navigator.platform||''),'UserAgent: '+navigator.userAgent,
      'Origin: '+location.origin,'Protocol: '+location.protocol,
      '接続先: '+(this.base||'（未接続）'),'版: '+(this.version||'—'),
      '話者: '+this.speakers.length+'件','',
      '--- ホストごとの結果 ---'];
    this.hostResults.forEach(h=>L.push(h.base+'  '+(h.ok?'成功':'失敗（'+h.kind+'）'+(h.message?' '+h.message:''))));
    L.push('','--- 通信の記録 ---');
    this.log.forEach(r=>L.push([r.at,r.method,r.url,r.status!=null?('status '+r.status):'',r.ms+'ms',r.error||''].filter(Boolean).join('  ')));
    if(!this.base){ const d=this.diagnose();
      L.push('','--- 推定 ---','推定原因: '+d.cause,'推定根拠: '+d.detail,'対処: '+(d.how||[]).join(' / ')); }
    return L.join('\n');
  }
}
const vv=new VoicevoxClient();

/* ---- VOICEVOXでの読み上げ ---- */
const vvCache=new Map();          // 合成した音声の使い回し
function vvKey(q){
  const sp=S.cfg.speak;
  return q.type+'\u0000'+q.text+'\u0000'+(q.type==='body'?sp.vvBody:sp.vvThread)+
         '\u0000'+sp.rate+'\u0000'+sp.pitch;
}
const vvPending=new Map();     // 合成中のもの（二重に投げない）
function vvBuild(q){
  const sp=S.cfg.speak;
  const id=(q.type==='body'?sp.vvBody:sp.vvThread);
  const key=vvKey(q);
  if(vvCache.has(key)) return Promise.resolve(vvCache.get(key));
  if(vvPending.has(key)) return vvPending.get(key);
  const p=(async()=>{
    const query=await vv.audioQuery(q.text,id);
    query.speedScale=sp.rate||1;
    query.pitchScale=Math.max(-0.15,Math.min(0.15,((sp.pitch||1)-1)*0.3));
    query.volumeScale=1;
    const buf=await vv.synthesis(query,id);
    if(vvCache.size>300) vvCache.clear();
    vvCache.set(key,buf);
    return buf;
  })();
  vvPending.set(key,p);
  p.catch(()=>{}).then(()=>vvPending.delete(key));
  return p;
}
async function vvSpeak(q){ return vvBuild(q); }
/** 先の行を裏で作っておく。読んでいる間に次が仕上がるようにする。 */
const VV_AHEAD=3;
function vvPrefetch(from,gen){
  if(S.cfg.speak.engine!=='voicevox'||!vv.base) return;
  for(let k=from;k<Math.min(from+VV_AHEAD,speakQ.length);k++){
    if(gen!==speakGen) return;
    vvBuild(speakQ[k]).catch(()=>{});
  }
}
function playBuffer(buf,volume){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(new Blob([buf],{type:'audio/wav'}));
    const a=new Audio();
    a.preload='auto';
    a.src=url;
    a.volume=Math.max(0,Math.min(1,volume==null?1:volume));
    curAudio=a;
    let ended=false;
    const done=()=>{ if(ended) return; ended=true; URL.revokeObjectURL(url); curAudio=null; res(); };
    a.onended=done;
    a.onerror=()=>{ if(ended) return; ended=true; URL.revokeObjectURL(url); curAudio=null; rej(new Error('再生できません')); };
    const go=()=>a.play().catch(e=>{ if(!ended){ ended=true; URL.revokeObjectURL(url); curAudio=null; rej(e); } });
    if(a.readyState>=3) go(); else { a.oncanplay=go; a.load(); }
  });
}

let speaking=false,speakQ=[],speakIdx=0,speakVoices=[],curAudio=null,speakGen=0;
function loadVoices(){ speakVoices=speechSynthesis.getVoices().filter(v=>/ja|JP/i.test(v.lang)); }
speechSynthesis.onvoiceschanged=loadVoices; loadVoices();

function toggleSpeak(){ speaking?stopSpeak():startSpeak(); }
async function startSpeak(){
  speakQ=speakQueue(lines,S.cfg.speak.mode,S.cfg.speak.dict);
  if(!speakQ.length){ toast('読み上げる行がありません'); return; }
  const c=curLineIndex();
  if(c>0){ const k=speakQ.findIndex(q=>q.i>=c); speakIdx=k<0?0:k; }
  else speakIdx=Math.min(ST().speakAt||0,speakQ.length-1);

  if(S.cfg.speak.engine==='voicevox'&&!vv.base){
    toast('VOICEVOXに接続しています…');
    const r=await vv.connect();
    if(!r.ok){ await vvTrouble(r.reason); return; }
  }
  speaking=true; speakGen++; $('#b-speak').classList.add('on');
  vvPrefetch(speakIdx,speakGen);        // 最初の数件を先に用意する
  nextSpeak(speakGen);
}
function stopSpeak(){
  speaking=false; speakGen++;
  try{ speechSynthesis.cancel(); }catch(e){}
  if(curAudio){ try{ curAudio.pause(); }catch(e){} curAudio=null; }
  $('#b-speak').classList.remove('on');
  [...ED.children].forEach(d=>d.classList.remove('play'));
  ST().speakAt=speakIdx; save();
  if(speakQ[speakIdx]) toast((speakQ[speakIdx].i+1)+'行目で止めました。次はここから始めます');
}
function highlightSpeak(i){
  [...ED.children].forEach(d=>d.classList.remove('play'));
  const d=ED.children[i];
  if(d){ d.classList.add('play'); d.scrollIntoView({block:'center'}); }
}
async function nextSpeak(gen){
  if(!speaking||gen!==speakGen) return;
  if(speakIdx>=speakQ.length){ ST().speakAt=0; save(); stopSpeak(); toast('最後まで読みました'); return; }
  const q=speakQ[speakIdx];
  // 直前に読んだ行との間にある空行の数だけ、間を空ける
  const prev=speakQ[speakIdx-1];
  if(prev){
    let blanks=0;
    for(let k=prev.i+1;k<q.i;k++) if(String(lines[k]||'').trim()==='') blanks++;
    const wait=blanks*(S.cfg.speak.gapMs||0);
    if(wait>0){
      vvPrefetch(speakIdx,gen);         // 間を空けている時間で次を作る
      await new Promise(r=>setTimeout(r,wait));
      if(!speaking||gen!==speakGen) return;
    }
  }
  highlightSpeak(q.i);
  if(S.cfg.speak.engine==='voicevox'){
    try{
      const p=vvSpeak(q);
      vvPrefetch(speakIdx+1,gen);       // 待っている間に先を作る
      const buf=await p;
      if(!speaking||gen!==speakGen) return;
      vvPrefetch(speakIdx+1,gen);
      await playBuffer(buf,S.cfg.speak.volume);
    }catch(e){
      if(!speaking||gen!==speakGen) return;
      stopSpeak();
      await vvTrouble(vv.base?{cause:'読み上げに失敗しました',detail:String(e&&e.message||e),
        how:['VOICEVOXが起動したままか確認する','接続を確かめ直す']}:vv.diagnose());
      return;
    }
    if(!speaking||gen!==speakGen) return;
    speakIdx++; ST().speakAt=speakIdx;
    nextSpeak(gen);
    return;
  }
  const u=new SpeechSynthesisUtterance(q.text);
  u.lang='ja-JP';
  u.rate=S.cfg.speak.rate||1; u.volume=S.cfg.speak.volume??1; u.pitch=S.cfg.speak.pitch||1;
  const want=q.type==='body'?S.cfg.speak.bodyVoice:S.cfg.speak.threadVoice;
  const v=speakVoices.find(x=>x.name===want)||speakVoices[0];
  if(v) u.voice=v;
  u.onend=()=>{ if(gen!==speakGen) return; speakIdx++; ST().speakAt=speakIdx; nextSpeak(gen); };
  u.onerror=()=>{ if(gen!==speakGen) return; speakIdx++; nextSpeak(gen); };
  speechSynthesis.speak(u);
}

/** 書式つきでクリップボードへ。
 *  実際に選択したものを複製して copy を起こす方式を先に試す。
 *  この方式は許可も画面の焦点も要らないため、ドキュメントへ最も確実に渡る。 */
function copyRich(html,text){
  const host=el('div');
  host.setAttribute('contenteditable','true');
  host.style.cssText='position:fixed;left:-9999px;top:0;width:1px;height:1px;overflow:hidden;white-space:pre-wrap';
  host.innerHTML=html;
  document.body.append(host);
  const sel=getSelection();
  const saved=sel.rangeCount?sel.getRangeAt(0).cloneRange():null;
  const r=document.createRange(); r.selectNodeContents(host);
  sel.removeAllRanges(); sel.addRange(r);
  let done=false;
  const h=e=>{
    e.stopPropagation(); e.preventDefault();
    e.clipboardData.setData('text/html',html);
    e.clipboardData.setData('text/plain',text);
    done=true;
  };
  document.addEventListener('copy',h,true);
  try{ document.execCommand('copy'); }catch(e){}
  document.removeEventListener('copy',h,true);
  host.remove();
  sel.removeAllRanges(); if(saved) sel.addRange(saved);
  return done;
}
async function putClipboard(src,kind){
  const text=kind==='plain'?src.map(strip).join('\n'):src.join('\n');
  if(kind==='txt'||kind==='plain'){
    try{ await navigator.clipboard.writeText(text); }
    catch(e){ if(!copyRich(text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\n/g,'<br>'),text)){ toast('コピーできませんでした'); return; } }
    toast(kind==='txt'?'記号つきでコピーしました':'プレーンでコピーしました');
    return;
  }
  const html=scriptToHtml(src,S.cfg.lh);
  if(copyRich(html,src.join('\n'))){ toast('書式付きでコピーしました。ドキュメントに貼れます'); return; }
  try{
    await navigator.clipboard.write([new ClipboardItem({
      'text/html':new Blob([html],{type:'text/html'}),
      'text/plain':new Blob([src.join('\n')],{type:'text/plain'})
    })]);
    toast('書式付きでコピーしました。ドキュメントに貼れます');
  }catch(e){ toast('コピーできませんでした'); }
}
/** いま選んでいる範囲を、記号つきの行の配列として取り出す。
 *  行の一部だけを選んでいる場合はその部分だけを返す。 */
function selectedRaw(){
  const sel=getSelection();
  if(!sel.rangeCount||sel.isCollapsed) return null;
  const r=sel.getRangeAt(0);
  const idx=n=>{ if(n===ED) return null; while(n&&n.parentNode!==ED) n=n.parentNode; return n?[...ED.children].indexOf(n):-1; };
  let a=idx(r.startContainer), b=idx(r.endContainer);
  if(a===null) a=0;
  if(b===null) b=lines.length-1;
  if(a<0||b<0) return null;
  // 各行の中での位置を出す
  const posIn=(li,node,offset)=>{
    const d=ED.children[li]; if(!d) return 0;
    const pre=r.cloneRange(); pre.selectNodeContents(d);
    try{ pre.setEnd(node,offset); }catch(e){ return shown(lines[li]).length; }
    return pre.toString().length;
  };
  const s0=posIn(a,r.startContainer,r.startOffset);
  const s1=posIn(b,r.endContainer,r.endOffset);
  const out=[];
  for(let i=a;i<=b;i++){
    const p=partsOf(lines[i]);
    if(MODE()==='marks'){
      let from=0,to=p.inner.length;
      if(i===a) from=innerOffset(p.inner,s0,MODE());
      if(i===b) to=innerOffset(p.inner,s1,MODE());
      out.push(buildRaw(p.bold,p.inner.slice(from,to)));
    }else{
      const ch=parseInner(p.inner);
      const from=i===a?s0:0, to=i===b?s1:ch.length;
      out.push(buildRaw(p.bold,serializeInner(ch.slice(from,to))));
    }
  }
  return {lines:out,a,b,s0,s1};
}
/* アプリ内で最後に出したもの。貼るときに書式の元として使う */
let lastClip=null;
function putSelectionOnClipboard(e){

  if(!sr) return;
  pushUndo(true);
  const pa=partsOf(lines[sr.a]), pb=partsOf(lines[sr.b]);
  const head=MODE()==='marks'?pa.inner.slice(0,innerOffset(pa.inner,sr.s0,MODE()))
                             :serializeInner(parseInner(pa.inner).slice(0,sr.s0));
  const tail=MODE()==='marks'?pb.inner.slice(innerOffset(pb.inner,sr.s1,MODE()))

});
async function pasteIn(){
  // Ctrl+V と同じ道筋にする。書式と素のテキストを必ず同じ項目から取り出し、
  // 片方だけで判断しない（素のテキストが取れないと空行が落ちるため）。
  let items=null;
  try{ items=await navigator.clipboard.read(); }catch(e){ items=null; }
  try{
    for(const it of (items||[])){
      let html='',txt='';
      if(it.types.includes('text/html')) html=await (await it.getType('text/html')).text();
      if(it.types.includes('text/plain')) txt=await (await it.getType('text/plain')).text();
      if(!html&&!txt) continue;
      insertText(pickPaste(html,txt));
      return;
    }
    const t=await navigator.clipboard.readText();
    if(t) insertText(pickPaste('',t));
    else toast('クリップボードが空です');
  }catch(e){
    toast('貼り付けできません。エディタの上で Ctrl+V を使ってください');
  }
}

/* ================== 大きい保存領域 ==================
 * 本文と設定は今までどおり小さい領域（約5MB）に置き、
 * 全文の複製を何度も持つ「履歴」と「自動保存」だけを大きい領域（IndexedDB）へ移す。
 * 大きい領域が使えない環境では、小さい領域に退避して動き続ける。 */
const BIG={
  db:null, ok:false, ready:null,
  open(){
    if(this.ready) return this.ready;
    this.ready=new Promise(res=>{
      try{
        if(!window.indexedDB){ res(false); return; }
        const r=indexedDB.open('daihon-studio',1);
        r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains('kv')) r.result.createObjectStore('kv'); };
        r.onsuccess=()=>{ this.db=r.result; this.ok=true; res(true); };
        r.onerror=()=>res(false);
        r.onblocked=()=>res(false);
      }catch(e){ res(false); }
    });
    return this.ready;
  },
  _tx(mode,fn){
    return new Promise(res=>{
      try{
        const tx=this.db.transaction('kv',mode), st=tx.objectStore('kv');
        const q=fn(st);
        tx.oncomplete=()=>res(q?q.result:true);
        tx.onerror=()=>res(undefined);
        tx.onabort=()=>res(undefined);
      }catch(e){ res(undefined); }
    });
  },
  async get(k){
    await this.open();
    if(!this.ok){ try{ return JSON.parse(localStorage.getItem('daihon-kv:'+k)); }catch(e){ return undefined; } }
    return this._tx('readonly',st=>st.get(k));
  },
  async set(k,v){
    await this.open();
    if(!this.ok){
      try{ localStorage.setItem('daihon-kv:'+k,JSON.stringify(v)); return true; }
      catch(e){ return false; }
    }
    const r=await this._tx('readwrite',st=>st.put(v,k));
    return r!==undefined;
  },
  async del(k){
    await this.open();
    if(!this.ok){ localStorage.removeItem('daihon-kv:'+k); return true; }
    return this._tx('readwrite',st=>st.delete(k));
  },
  async keys(){
    await this.open();
    if(!this.ok){
      const out=[];
      for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k&&k.startsWith('daihon-kv:')) out.push(k.slice(10)); }
      return out;
    }
    const r=await this._tx('readonly',st=>st.getAllKeys());
    return r||[];
  }
};
const VER_MAX=50;                    // 1工程あたりの履歴の上限
const SNAP_MAX=10;                   // 自動保存の件数
const verKey=s=>'ver:'+s.id;
async function getVersions(s){ const v=await BIG.get(verKey(s)); return Array.isArray(v)?v:[]; }
async function setVersions(s,arr){
  if(!arr.length) return BIG.del(verKey(s));
  return BIG.set(verKey(s),arr.slice(0,VER_MAX));
}
async function getSnaps(){ const v=await BIG.get('snap'); return Array.isArray(v)?v:[]; }

/** 起動時に一度だけ：小さい領域にあった履歴と自動保存を大きい領域へ移す */
async function migrateToBig(){
  await BIG.open();
  let moved=0;
  for(const w of S.works){
    for(const s of w.stages){
      if(!s.id) s.id=uid();
      if(Array.isArray(s.versions)&&s.versions.length){
        const cur=await getVersions(s);
        await setVersions(s,s.versions.concat(cur));
        moved+=s.versions.length;
      }
      delete s.versions;
    }
  }
  try{
    const old=JSON.parse(localStorage.getItem('daihon-studio-snap')||'null');
    if(Array.isArray(old)&&old.length){
      const cur=await getSnaps();
      await BIG.set('snap',old.concat(cur).slice(0,SNAP_MAX));
    }
    localStorage.removeItem('daihon-studio-snap');
  }catch(e){}
  if(moved||true){
    try{ localStorage.setItem(LS,JSON.stringify(S)); }catch(e){}
  }
  // 消えた工程の履歴を片付ける
  await purgeOrphans();
  // 大きい領域を勝手に消されないよう、ブラウザにお願いしておく
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  if(moved) toast('履歴'+moved+'件を大きい保存領域へ移しました');
  checkCapacity(true);
  return moved;
}
async function purgeOrphans(){
  const ids=new Set();
  S.works.forEach(w=>w.stages.forEach(s=>ids.add('ver:'+s.id)));
  let n=0;
  for(const k of await BIG.keys()){
    if(String(k).startsWith('ver:')&&!ids.has(k)){ await BIG.del(k); n++; }
  }
  return n;
}

/* ---- 容量 ---- */
const SMALL_LIMIT=5*1024*1024;       // 小さい領域の目安（バイト）
function smallUsed(){
  let n=0;
  try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); n+=(k.length+(localStorage.getItem(k)||'').length)*2; } }catch(e){}
  return n;
}
const sizeOf=v=>JSON.stringify(v||'').length*2;
const fmtB=n=>n<1024?n+'B':n<1024*1024?(n/1024).toFixed(0)+'KB':(n/1024/1024).toFixed(1)+'MB';
let warnedCap=false;
/** 小さい領域が8割を超えたら知らせる */
function checkCapacity(quiet){
  const u=smallUsed();
  const r=u/SMALL_LIMIT;
  if(r>=0.8&&!warnedCap){
    warnedCap=true;
    toast('保存領域が'+Math.round(r*100)+'%まで埋まっています。履歴 →「容量と整理」で確かめてください');
  }
  return r;
}

/* ---- 保存：失敗したら整理の画面へ案内する ---- */
function save(){
  clearTimeout(saveT);
  saveT=setTimeout(()=>{
    S.cfg.dict={approved:DICT.approved,headDeny:DICT.headDeny,headExempt:DICT.headExempt,
                dupAllow:DICT.dupAllow,dupCommon:DICT.dupCommon,dupExtra:DICT.dupExtra,
                nonJoyo:DICT.nonJoyo,

                kanjiExempt:DICT.kanjiExempt,kanjiCaution:DICT.kanjiCaution,proper:DICT.proper};
    try{ localStorage.setItem(LS,JSON.stringify(S)); checkCapacity(); }
    catch(e){
      toast('保存できません（容量超過）。整理の画面を開きます');
      versionMenu('cap');
    }
  },600);
}

function snapshot(){

/* ================== 履歴 ================== */
/** tab: 'ver'（この工程の履歴）／'snap'（自動保存）／'cap'（容量と整理） */
async function versionMenu(tab){
  await BIG.open();
  const box=el('div');
  box.innerHTML='<div class="tabs"><button data-p="ver">この工程の履歴</button>'+
    '<button data-p="snap">自動保存</button><button data-p="cap">容量と整理</button></div>'+
    '<div class="tp" id="hp-ver"></div><div class="tp" id="hp-snap"></div><div class="tp" id="hp-cap"></div>';
  const show=p=>{
    box.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));
    box.querySelectorAll('.tp').forEach(x=>x.classList.toggle('on',x.id==='hp-'+p));
    if(p==='ver') drawVer(); if(p==='snap') drawSnap(); if(p==='cap') drawCap();
  };
  box.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>show(b.dataset.p));
  const dlgClose=()=>{ const d=box.closest('dialog'); if(d) d.close(); };

  /* この工程の履歴 */
  async function drawVer(){
    const pane=box.querySelector('#hp-ver'); pane.textContent='';
    const vs=await getVersions(ST());
    const bar=el('div','row'); bar.style.border='none'; bar.style.padding='0 0 8px';
    const add=el('button','btn mini on','いまの内容を残す');
    add.onclick=async()=>{
      const inp=el('input'); inp.type='text'; inp.value=new Date().toLocaleString('ja-JP');
      const holder=el('div'); holder.append(el('p','note','名前を付けます。'),inp);
      // 履歴の画面の上に重ねて出す
      if(await dialog('履歴の名前',holder,[{t:'取消',v:null},{t:'残す',v:'ok',primary:true}])!=='ok') return;
      const cur=await getVersions(ST());
      cur.unshift({t:Date.now(),name:inp.value.trim()||'無題',text:lines.join('\n'),n:countChars(lines)});
      if(await setVersions(ST(),cur)) toast('履歴に残しました'); else toast('残せませんでした');
      drawVer();
    };
    bar.append(add,el('span','note',vs.length+'件（上限'+VER_MAX+'件）'));
    pane.append(bar);
    if(!vs.length){ pane.append(el('p','note','この工程の履歴はまだありません。')); return; }
    const t=el('table','diff');
    t.innerHTML='<tr><th>日時</th><th>名前</th><th>字数</th><th></th></tr>';
    vs.forEach((v,k)=>{
      const tr=el('tr');
      tr.innerHTML='<td>'+new Date(v.t).toLocaleString('ja-JP')+'</td><td></td><td>'+(v.n||0)+'</td><td></td>';
      tr.children[1].textContent=v.name;
      const cell=tr.children[3];
      const ld=el('button','btn mini','戻す'), df=el('button','btn mini','比較'), x=el('button','btn mini','×');
      x.title='この履歴を消す';
      ld.onclick=async()=>{
        if(!await confirmBox('履歴に戻す','「'+v.name+'」に戻します。いまの内容は置きかわります。','戻す')) return;
        pushUndo(true); lines=v.text.split('\n'); renderAll(); afterEdit(); runCheck();
        toast('戻しました'); dlgClose();
      };
      df.onclick=()=>showDiff(v);
      x.onclick=async()=>{
        const cur=await getVersions(ST());
        const i=cur.findIndex(z=>z.t===v.t&&z.name===v.name);
        if(i>=0) cur.splice(i,1);
        await setVersions(ST(),cur);
        toast('「'+v.name+'」を消しました');
        drawVer();                         // 画面は閉じずにその場で更新する
      };
      cell.append(ld,df,x);
      t.append(tr);
    });
    pane.append(t);
  }

  /* 自動保存 */
  async function drawSnap(){
    const pane=box.querySelector('#hp-snap'); pane.textContent='';
    const snaps=await getSnaps();
    pane.append(el('p','note','書いている間、20秒ごとに直近'+SNAP_MAX+'件まで自動で残します。'));
    if(!snaps.length){ pane.append(el('p','note','自動保存はまだありません。')); return; }
    const all=el('button','btn mini','自動保存をすべて消す');
    all.onclick=async()=>{
      if(!await confirmBox('自動保存を消す',snaps.length+'件をすべて消します。','消す')) return;
      await BIG.del('snap'); toast('自動保存を消しました'); drawSnap();
    };
    pane.append(all);
    const t=el('table','diff');
    snaps.forEach((v,k)=>{
      const tr=el('tr');
      tr.innerHTML='<td>'+new Date(v.t).toLocaleString('ja-JP')+'</td><td></td><td></td>';
      tr.children[1].textContent=v.w+' / '+v.s;
      const ld=el('button','btn mini','戻す'), x=el('button','btn mini','×');
      ld.onclick=async()=>{
        if(!await confirmBox('自動保存から戻す','いまの内容を置きかえます。','戻す')) return;
        pushUndo(true); lines=v.text.split('\n'); renderAll(); afterEdit(); runCheck();
        toast('自動保存から戻しました'); dlgClose();
      };
      x.onclick=async()=>{
        const cur=await getSnaps();
        const i=cur.findIndex(z=>z.t===v.t); if(i>=0) cur.splice(i,1);
        if(cur.length) await BIG.set('snap',cur); else await BIG.del('snap');
        drawSnap();
      };
      tr.children[2].append(ld,x);
      t.append(tr);
    });
    pane.append(t);
  }

  /* 容量と整理 */
  async function drawCap(){
    const pane=box.querySelector('#hp-cap'); pane.textContent='';
    const used=smallUsed(), r=used/SMALL_LIMIT;
    const meter=(label,val,max,note)=>{
      const wrap=el('div'); wrap.style.margin='6px 0 12px';
      const pct=max?Math.min(100,val/max*100):0;
      const head=el('div'); head.style.display='flex'; head.style.justifyContent='space-between';
      head.append(el('span',null,label),el('span','note',fmtB(val)+(max?' ／ '+fmtB(max):'')));
      const bar=el('div'); bar.style.cssText='height:10px;border-radius:5px;background:var(--chrome-2);overflow:hidden;margin-top:4px';
      const fill=el('div'); fill.style.cssText='height:100%;width:'+pct+'%;background:'+(pct>=80?'var(--err)':pct>=60?'var(--warn)':'var(--ai)');
      bar.append(fill); wrap.append(head,bar);
      if(note) wrap.append(el('p','note',note));
      return wrap;
    };
    pane.append(meter('本文と設定（小さい領域）',used,SMALL_LIMIT,
      r>=0.8?'残りわずかです。使わない台本を閉じてください。':'余裕があります。'));
    // 大きい領域の内訳
    let verTotal=0;
    const rows=[];
    for(const w of S.works){
      for(const s of w.stages){
        const vs=await getVersions(s);
        const sz=sizeOf(vs);
        verTotal+=sz;
        rows.push({w,s,n:vs.length,sz,text:sizeOf(s.text)});
      }
    }
    const snapSz=sizeOf(await getSnaps());
    let est=null;
    try{ if(navigator.storage&&navigator.storage.estimate) est=await navigator.storage.estimate(); }catch(e){}
    pane.append(meter('履歴と自動保存（大きい領域）',verTotal+snapSz,est&&est.quota?est.quota:0,
      BIG.ok?'大きい保存領域を使っています。':'この環境では大きい保存領域が使えないため、小さい領域に入れています。'));

    // 一括整理
    const tidy=el('div'); tidy.style.cssText='border:1px solid var(--rule);border-radius:6px;padding:10px;margin:4px 0 12px';
    tidy.append(el('b',null,'古い履歴をまとめて消す'));
    const line=el('div','row'); line.style.border='none'; line.style.padding='8px 0 0';
    const keep=el('input'); keep.type='number'; keep.min='0'; keep.max=String(VER_MAX); keep.value='5'; keep.style.width='70px';
    const go=el('button','btn mini on','実行');
    line.append(el('span',null,'すべての工程で、新しい'),keep,el('span',null,'件だけ残す'),go);
    const alsoSnap=el('label'); const cs=el('input'); cs.type='checkbox'; cs.checked=true;
    alsoSnap.append(cs,document.createTextNode(' 自動保存も消す'));
    tidy.append(line,alsoSnap);
    go.onclick=async()=>{
      const k=Math.max(0,Math.floor(+keep.value||0));
      let drop=0;
      for(const row of rows){ if(row.n>k) drop+=row.n-k; }
      const msg='すべての台本・工程で、新しい'+k+'件より古い履歴'+drop+'件を消します。'+(cs.checked?'自動保存も消します。':'')+'元に戻せません。';
      if(!await confirmBox('古い履歴を消す',msg,'消す')) return;
      for(const row of rows){
        if(row.n>k){ const vs=await getVersions(row.s); await setVersions(row.s,vs.slice(0,k)); }
      }
      if(cs.checked) await BIG.del('snap');
      const o=await purgeOrphans();
      toast(drop+'件の履歴を消しました'+(o?'（使われていない履歴'+o+'件も片付けました）':''));
      drawCap();
    };
    pane.append(tidy);

    // 内訳の表
    pane.append(el('p','note','台本と工程ごとの内訳'));
    const t=el('table','diff');
    t.innerHTML='<tr><th>台本 / 工程</th><th>本文</th><th>履歴</th><th></th></tr>';
    rows.sort((a,b)=>b.sz-a.sz).forEach(row=>{
      const tr=el('tr');
      tr.innerHTML='<td></td><td>'+fmtB(row.text)+'</td><td>'+row.n+'件 '+fmtB(row.sz)+'</td><td></td>';
      tr.children[0].textContent=row.w.name+' / '+row.s.name;
      if(row.n){
        const x=el('button','btn mini','履歴を消す');
        x.onclick=async()=>{
          if(!await confirmBox('履歴を消す','「'+row.w.name+' / '+row.s.name+'」の履歴'+row.n+'件をすべて消します。','消す')) return;
          await setVersions(row.s,[]); toast('消しました'); drawCap();
        };
        tr.children[3].append(x);
      }
      t.append(tr);
    });
    pane.append(t);
  }

  const d=dialog('履歴',box,[{t:'閉じる',v:null}]);
  show(tab==='cap'||tab==='snap'?tab:'ver');
  await d;
}

function showDiff(v){
  const a=v.text.split('\n'), b=lines;
  const box=el('div');
  const t=el('table','diff');
  let rows='',n=0;
  for(let i=0;i<Math.max(a.length,b.length)&&n<200;i++){
    if((a[i]||'')===(b[i]||'')) continue;
    n++;
    rows+='<tr><td>'+(i+1)+'</td><td style="color:var(--err)">'+snip(shown(a[i]||''),40)+
          '</td><td style="color:var(--ai)">'+snip(shown(b[i]||''),40)+'</td></tr>';
  }
  t.innerHTML='<tr><th>行</th><th>'+v.name+'</th><th>いま</th></tr>'+(rows||'<tr><td colspan="3">違いはありません</td></tr>');
  box.append(el('p','note','行がずれている場合は同じ位置どうしで比べます。'),t);
  dialog('履歴との比較',box,[{t:'閉じる',v:null}]);
}

/* ================== 工程・作品 ================== */
function renderStages(){
  const box=$('#stages'); box.textContent='';
  W().stages.forEach((s,k)=>{
    const b=el('button','stage'+(k===W().as?' on':''));
    const dot=el('span','dot'+((s.marks&&s.marks.length)?'':' off'));
    if(s.marks&&s.marks.length) dot.style.background=cvar(MARK_COLORS[(s.marks[0].c||1)-1]);
    b.append(dot,el('span','nm',s.name),el('span','ct',String(countChars(s.text.split('\n')))));
    const at=()=>W().stages.indexOf(s);
    b.onclick=()=>{ const i=at(); if(i<0){ renderStages(); return; } W().as=i; save(); loadStage(); };
    b.ondblclick=async()=>{
      const inp=el('input'); inp.type='text'; inp.value=s.name;
      const v=await dialog('工程',inp,[{t:'取消',v:null},{t:'削除',v:'del'},{t:'変更',v:'ok',primary:true}]);
      if(v==='ok'&&inp.value.trim()){ s.name=inp.value.trim(); save(); loadStage(); }
      if(v==='del'){
        if(W().stages.length<2){ toast('最後の工程は消せません'); return; }
        if(!await confirmBox('工程の削除','「'+s.name+'」を削除します。元に戻せません。','削除する')) return;
        const i=at(); if(i<0){ renderStages(); return; }
        W().stages.splice(i,1); W().as=Math.max(0,i-1); save(); loadStage(); purgeOrphans();
      }
    };
    b.draggable=true;
    b.ondragstart=e=>e.dataTransfer.setData('text/plain',s.id);
    b.ondragover=e=>e.preventDefault();
    b.ondrop=e=>{
      e.preventDefault();
      const id=e.dataTransfer.getData('text/plain');
      const from=W().stages.findIndex(x=>x.id===id), to=at();
      if(from<0||to<0||from===to) return;
      const cur=ST();
      const [m]=W().stages.splice(from,1); W().stages.splice(to,0,m);
      W().as=W().stages.indexOf(cur); save(); renderStages(); renderRefSel();
    };
    box.append(b);
  });
  const add=el('button',null,'＋ 工程を追加'); add.id='stage-add';
  add.onclick=async()=>{
    const inp=el('input'); inp.type='text'; inp.placeholder='工程の名前';
    if(await dialog('工程を追加',inp,[{t:'取消',v:null},{t:'追加',v:'ok',primary:true}])==='ok'&&inp.value.trim()){
      W().stages.push(newStage(inp.value.trim())); W().as=W().stages.length-1; save(); loadStage();
    }
  };
  box.append(add);
}
function renderWorks(){
  const box=$('#worktabs'); box.textContent='';
  S.works.forEach((w,k)=>{
    const b=el('button','wtab'+(k===S.aw?' on':''));
    b.append(el('span',null,w.name));
    const x=el('span','x','×');
    x.onclick=async e=>{
      e.stopPropagation();

      if(!await confirmBox('台本を閉じる','「'+w.name+'」を閉じます。','閉じる')) return;
      const i=S.works.indexOf(w); if(i<0){ renderWorks(); return; }
      S.works.splice(i,1); S.aw=Math.max(0,i-1); save(); renderWorks(); loadStage(); purgeOrphans();
    };
    b.append(x);

    b.onclick=()=>{ const i=wat(); if(i<0){ renderWorks(); return; } S.aw=i; save(); renderWorks(); loadStage(); };
    b.ondblclick=async()=>{
      const inp=el('input'); inp.type='text'; inp.value=w.name;
      if(await dialog('台本の名前',inp,[{t:'取消',v:null},{t:'変更',v:'ok',primary:true}])==='ok'&&inp.value.trim()){
        w.name=inp.value.trim(); save(); renderWorks(); loadStage();

  add.onclick=()=>{ S.works.push(newWork('台本'+(S.works.length+1))); S.aw=S.works.length-1; save(); renderWorks(); loadStage(); };

}

/* ================== 見た目の適用 ================== */
function applyLook(){
  const r=document.documentElement.style;
  r.setProperty('--ed-font',S.cfg.font);
  r.setProperty('--ed-size',S.cfg.size+'px');
  r.setProperty('--ref-size',S.cfg.refSize+'px');
  r.setProperty('--ed-lh',String(S.cfg.lh));
  r.setProperty('--fx-at-bg',S.cfg.fx.atBg);
  r.setProperty('--fx-pp-bg',S.cfg.fx.ppBg);
  r.setProperty('--fx-pp-fg',S.cfg.fx.ppFg);
  setFxColors(S.cfg.fx);
  r.setProperty('--bad-a',String(S.cfg.badAlpha));
  r.setProperty('--bad-bar',S.cfg.badBar+'px');
  ED.classList.toggle('guide',S.cfg.guide!==false);
  document.body.className='st-'+S.cfg.badStyle;
  $('#stages').style.width=S.cfg.stagesW+'px';
  $('#side').style.width=S.cfg.sideW+'px';
  $('#refbox').style.height=S.cfg.refH+'px';
  $('#refbox').classList.toggle('hide',!S.cfg.refOn);
  $('#sp3').style.display=S.cfg.refOn?'':'none';
  $('#ref-size').value=S.cfg.refSize; $('#ed-size').value=S.cfg.size;
}
/* 幅・高さのドラッグ */
function drag(handle,fn){
  handle.addEventListener('pointerdown',e=>{
    e.preventDefault(); handle.setPointerCapture(e.pointerId); handle.classList.add('drag');
    const move=ev=>fn(ev);
    const up=()=>{ handle.classList.remove('drag'); save();
      handle.removeEventListener('pointermove',move); handle.removeEventListener('pointerup',up); };
    handle.addEventListener('pointermove',move); handle.addEventListener('pointerup',up);
  });
}
drag($('#sp1'),e=>{ S.cfg.stagesW=Math.max(90,Math.min(400,e.clientX)); applyLook(); });
drag($('#sp2'),e=>{ S.cfg.sideW=Math.max(180,Math.min(760,innerWidth-e.clientX)); applyLook(); });
drag($('#sp3'),e=>{
  const side=$('#side').getBoundingClientRect();
  const top=$('#refbox').getBoundingClientRect().top;
  const max=Math.max(80,side.bottom-top-170);   // タブと一覧の場所を必ず残す
  S.cfg.refH=Math.max(80,Math.min(max,e.clientY-top));
  applyLook();
});
